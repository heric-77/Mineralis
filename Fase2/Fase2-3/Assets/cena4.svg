  <ellipse cx="280" cy="420" rx="340" ry="24" fill="#7C2030" fill-opacity="0.60"/>
  <ellipse cx="300" cy="434" rx="300" ry="12" fill="#B04020" fill-opacity="0.55"/>
  <ellipse cx="1160" cy="410" rx="300" ry="22" fill="#781E2C" fill-opacity="0.58"/>
  <ellipse cx="1180" cy="424" rx="270" ry="11" fill="#A83C1E" fill-opacity="0.52"/>

