  <rect x="1020" y="552" width="140" height="50" fill="#130F18" rx="3"/>
  <rect x="1036" y="540" width="108" height="26" fill="#110D16" rx="2"/>
  <rect x="1054" y="530" width="70" height="20" fill="#0F0B14" rx="2"/>

