  <rect x="704" y="574" width="48" height="4" fill="#FFB830" fill-opacity="0.5"/>
  <rect x="706" y="578" width="44" height="4" fill="#FFA820" fill-opacity="0.45"/>
  <rect x="708" y="582" width="40" height="4" fill="#FF9810" fill-opacity="0.40"/>
  <rect x="710" y="586" width="36" height="4" fill="#F08010" fill-opacity="0.35"/>
  <rect x="712" y="590" width="32" height="4" fill="#E07010" fill-opacity="0.30"/>

