  <rect x="1440" y="408" width="9" height="200" fill="#0C0A12"/>
  <polygon points="1440,300 1496,410 1384,410" fill="#0A0810"/>
  <polygon points="1444,340 1494,410 1390,410" fill="#0C0A12"/>
  <polygon points="1448,372 1492,410 1396,410" fill="#080610"/>

  <rect x="1383" y="420" width="8" height="188" fill="#0C0A12"/>
  <polygon points="1383,318 1435,422 1331,422" fill="#0A0810"/>
  <polygon points="1387,352 1433,422 1337,422" fill="#0C0A12"/>
  <polygon points="1391,382 1431,422 1343,422" fill="#080610"/>

  <rect x="1314" y="428" width="8" height="180" fill="#0C0A12"/>
  <polygon points="1314,330 1364,430 1264,430" fill="#0A0810"/>
  <polygon points="1318,360 1362,430 1270,430" fill="#0C0A12"/>
  <polygon points="1322,390 1360,430 1276,430" fill="#080610"/>

  <rect x="1240" y="434" width="7" height="174" fill="#0C0A12"/>
  <polygon points="1240,342 1286,436 1194,436" fill="#0A0810"/>
  <polygon points="1244,370 1284,436 1200,436" fill="#0C0A12"/>

  <!-- STARS emerging in upper sky (dusk) -->
  <rect x="140" y="36" width="2" height="2" fill="#D0C8E8" fill-opacity="0.55"/>
  <rect x="380" y="52" width="2" height="2" fill="#C8C0E0" fill-opacity="0.50"/>
  <rect x="560" y="30" width="2" height="2" fill="#D0C8E8" fill-opacity="0.48"/>
  <rect x="840" y="58" width="2" height="2" fill="#C8C0E0" fill-opacity="0.45"/>
  <rect x="1060" y="38" width="2" height="2" fill="#D0C8E8" fill-opacity="0.50"/>
  <rect x="1280" y="48" width="2" height="2" fill="#C8C0E0" fill-opacity="0.46"/>
  <rect x="1380" y="28" width="2" height="2" fill="#C8C0E0" fill-opacity="0.42"/>
  <rect x="250" y="110" width="2" height="2" fill="#C8C0E0" fill-opacity="0.40"/>
  <rect x="980" y="88" width="2" height="2" fill="#C8C0E0" fill-opacity="0.38"/>

  <!-- GORGET OF COPPER glow hint - subtle warm light near shore -->
  <!-- Representing the artifact found -->
  <ellipse cx="728" cy="608" rx="16" ry="10" fill="#C05820" fill-opacity="0.45"/>
  <ellipse cx="728" cy="608" rx="10" ry="6" fill="#D06828" fill-opacity="0.55"/>
  <ellipse cx="728" cy="608" rx="5" ry="3" fill="#E07C38" fill-opacity="0.65"/>

  <!-- GEOLOGICAL STRATA CROSS SECTION -->
  <rect x="0" y="710" width="1456" height="22" fill="#1C181E"/>
  <rect x="0" y="710" width="1456" height="3" fill="#2A2430"/>
  <!-- Copper vein band -->
  <rect x="0" y="720" width="1456" height="3" fill="#7C2810" fill-opacity="0.65"/>
  <rect x="0" y="723" width="1456" height="1" fill="#9C3818" fill-opacity="0.5"/>
  <rect x="0" y="732" width="1456" height="107" fill="url(#basaltDeep)"/>

  <!-- EVENING MIST close to ground - thicker for mood -->
  <ellipse cx="400" cy="604" rx="500" ry="20" fill="#8C3014" fill-opacity="0.12"/>
  <ellipse cx="1100" cy="606" rx="450" ry="18" fill="#8A2C12" fill-opacity="0.10"/>

  <!-- PLATFORM LEDGES -->
  <!-- Left shore ledge -->
  <rect x="40" y="598" width="220" height="14" fill="url(#groundRock)"/>
  <rect x="40" y="598" width="220" height="3" fill="#2C2630"/>

  <!-- Center-left ledge -->
  <rect x="380" y="588" width="180" height="14" fill="url(#groundRock)"/>
  <rect x="380" y="588" width="180" height="3" fill="#2A2430"/>

  <!-- Center ledge - slightly elevated near gorget -->
  <rect x="640" y="582" width="176" height="14" fill="url(#groundRock)"/>
  <rect x="640" y="582" width="176" height="3" fill="#2C2630"/>

  <!-- Center-right ledge -->
  <rect x="900" y="586" width="180" height="14" fill="url(#groundRock)"/>
  <rect x="900" y="586" width="180" height="3" fill="#2A2430"/>

  <!-- Right shore ledge -->
  <rect x="1196" y="596" width="220" height="14" fill="url(#groundRock)"/>
  <rect x="1196" y="596" width="220" height="3" fill="#2C2630"/>
</svg>
