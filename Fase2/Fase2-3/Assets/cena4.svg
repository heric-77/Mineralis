  <ellipse cx="728" cy="566" rx="900" ry="32" fill="#C06020" fill-opacity="0.18"/>
  <ellipse cx="400" cy="574" rx="600" ry="22" fill="#B85820" fill-opacity="0.15"/>
  <ellipse cx="1100" cy="570" rx="500" ry="20" fill="#C06828" fill-opacity="0.14"/>

