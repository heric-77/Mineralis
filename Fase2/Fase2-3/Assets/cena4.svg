      <rect width="48" height="1" fill="#121016"/>
      <rect y="10" width="48" height="1" fill="#121016"/>
      <rect width="1" height="10" fill="#121016"/>
      <rect x="47" width="1" height="10" fill="#121016"/>
      <rect x="24" y="10" width="1" height="10" fill="#121016"/>
    </pattern>
  </defs>

  <!-- ===== SKY: GOLDEN SUNSET - Lake Superior at dusk ===== -->
  <!-- Deep purple-blue zenith -->
  <rect x="0" y="0" width="1456" height="839" fill="#150C20"/>
  <rect x="0" y="0" width="1456" height="78" fill="#1A0E28"/>
  <rect x="0" y="55" width="1456" height="96" fill="#240E30"/>
  <rect x="0" y="138" width="1456" height="90" fill="#34143A"/>
  <rect x="0" y="216" width="1456" height="82" fill="#4C1840"/>
  <rect x="0" y="286" width="1456" height="76" fill="#682040"/>
  <!-- Sunset blush zone -->
  <rect x="0" y="348" width="1456" height="70" fill="#8C2C38"/>
  <rect x="0" y="406" width="1456" height="62" fill="#B03828"/>
  <rect x="0" y="456" width="1456" height="56" fill="#C84C20"/>
  <!-- Horizon glow - warm gold-orange -->
  <rect x="0" y="500" width="1456" height="46" fill="#D86018"/>
  <rect x="0" y="534" width="1456" height="36" fill="#E07820"/>

  <!-- SUNSET SUN - large, flattened, low on horizon center -->
  <ellipse cx="728" cy="544" rx="80" ry="52" fill="#FFD040" fill-opacity="0.85"/>
  <ellipse cx="728" cy="552" rx="80" ry="30" fill="#FFC030" fill-opacity="0.7"/>
  <ellipse cx="728" cy="548" rx="56" ry="38" fill="#FFE050" fill-opacity="0.9"/>
  <ellipse cx="728" cy="548" rx="36" ry="24" fill="#FFF080" fill-opacity="0.95"/>
  <!-- Sun reflection path on water - vertical bar -->
