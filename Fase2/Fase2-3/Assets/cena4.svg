  <ellipse cx="200" cy="188" rx="160" ry="28" fill="#4A1830" fill-opacity="0.7"/>
  <!-- Cloud bottom lit edges -->
  <ellipse cx="180" cy="216" rx="180" ry="14" fill="#9C4028" fill-opacity="0.55"/>

