  <ellipse cx="1000" cy="288" rx="260" ry="28" fill="#641A38" fill-opacity="0.62"/>
  <ellipse cx="1020" cy="304" rx="220" ry="13" fill="#9C3C28" fill-opacity="0.48"/>

