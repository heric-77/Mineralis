  <rect x="0" y="570" width="1456" height="28" fill="#3A1C18"/>
  <rect x="0" y="580" width="1456" height="18" fill="#341818"/>
  <!-- Warm water ripples -->
  <rect x="0" y="572" width="1456" height="2" fill="#5A2C18" fill-opacity="0.8"/>
