  <rect x="40" y="548" width="160" height="54" fill="#130F18" rx="4"/>
  <rect x="55" y="536" width="120" height="26" fill="#110D16" rx="3"/>
  <rect x="72" y="526" width="80" height="20" fill="#0F0B14" rx="3"/>
