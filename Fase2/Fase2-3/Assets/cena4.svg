  <polygon points="0,300 56,410 -56,410" fill="#0A0810"/>
  <polygon points="4,340 54,410 -46,410" fill="#0C0A12"/>
  <polygon points="8,372 52,410 -36,410" fill="#080610"/>

  <rect x="58" y="420" width="8" height="188" fill="#0C0A12"/>
  <polygon points="58,318 110,422 6,422" fill="#0A0810"/>
  <polygon points="62,352 108,422 12,422" fill="#0C0A12"/>
  <polygon points="66,382 106,422 18,422" fill="#080610"/>

  <rect x="128" y="428" width="8" height="180" fill="#0C0A12"/>
  <polygon points="128,330 178,430 78,430" fill="#0A0810"/>
  <polygon points="132,360 176,430 84,430" fill="#0C0A12"/>
  <polygon points="136,390 174,430 90,430" fill="#080610"/>

  <rect x="204" y="434" width="7" height="174" fill="#0C0A12"/>
  <polygon points="204,342 250,436 158,436" fill="#0A0810"/>
  <polygon points="208,370 248,436 164,436" fill="#0C0A12"/>

