<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="1456" height="839" viewBox="0 0 1456 839" version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="basalt" x="0" y="0" width="64" height="20" patternUnits="userSpaceOnUse">
      <rect width="64" height="20" fill="#1C1A1E"/>
      <rect width="64" height="1" fill="#141218"/>
      <rect y="10" width="64" height="1" fill="#141218"/>
      <rect width="1" height="10" fill="#141218"/>
      <rect x="63" width="1" height="10" fill="#141218"/>
      <rect x="32" y="10" width="1" height="10" fill="#141218"/>
    </pattern>
    <pattern id="basaltDeep" x="0" y="0" width="64" height="20" patternUnits="userSpaceOnUse">
      <rect width="64" height="20" fill="#12101A"/>
      <rect width="64" height="1" fill="#0A0810"/>
      <rect y="10" width="64" height="1" fill="#0A0810"/>
      <rect width="1" height="10" fill="#0A0810"/>
      <rect x="63" width="1" height="10" fill="#0A0810"/>
      <rect x="32" y="10" width="1" height="10" fill="#0A0810"/>
    </pattern>
    <pattern id="groundRock" x="0" y="0" width="48" height="20" patternUnits="userSpaceOnUse">
