<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="194" height="166" viewBox="0 0 194 166" role="img" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>Crachá de Breaker Boy</title>
  <desc>Chapa de identificação de trabalhador infantil — EUA 1894</desc>

  <!-- HEADER -->
  <rect x="0" y="0" width="194" height="32" rx="8" fill="#1A1C28"/>
  <rect x="0" y="22" width="194" height="10" fill="#1A1C28"/>
  <text x="97" y="15" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#9090A8" font-weight="bold">Crachá de Breaker Boy</text>
  <text x="97" y="27" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#585868">Identificação · Breaker Boy</text>

  <!-- CORRENTE/FITA (como era usado — pendurado no pescoço) -->
  <line x1="97" y1="40" x2="85" y2="52" stroke="#4A4840" stroke-width="2.5" stroke-dasharray="3 2"/>
  <line x1="97" y1="40" x2="109" y2="52" stroke="#4A4840" stroke-width="2.5" stroke-dasharray="3 2"/>
  <circle cx="97" cy="40" r="4" fill="none" stroke="#5A5848" stroke-width="2"/>

  <!-- FURO DE SUSPENSÃO -->
  <circle cx="97" cy="57" r="5"   fill="#2A2820"/>
  <circle cx="97" cy="57" r="3.5" fill="#181810"/>

  <!-- CHAPA DE METAL PRINCIPAL (amassada, desgastada) -->
  <!-- Sombra -->
  <rect x="42" y="56" width="115" height="80" rx="4" fill="#141412"/>
  <!-- Corpo da chapa -->
  <rect x="40" y="54" width="114" height="80" rx="3" fill="#484840"/>
  <!-- Superfície desgastada -->
  <rect x="42" y="56" width="110" height="76" rx="2" fill="#585850"/>
  <!-- Reflexos metálicos irregulares (metal batido) -->
  <ellipse cx="70"  cy="74" rx="22" ry="10" fill="#646458" opacity="0.6"/>
  <ellipse cx="125" cy="100" rx="16" ry="8"  fill="#646458" opacity="0.5"/>
  <ellipse cx="90"  cy="118" rx="20" ry="7"  fill="#505048" opacity="0.6"/>

  <!-- AMASSADOS e DOBRAS no metal -->
  <line x1="40" y1="80" x2="55"  y2="78" stroke="#3A3A32" stroke-width="2"/>
  <line x1="40" y1="82" x2="53"  y2="81" stroke="#6A6A60" stroke-width="1"/>
  <line x1="140" y1="98" x2="154" y2="104" stroke="#3A3A32" stroke-width="2"/>
  <line x1="141" y1="100" x2="154" y2="106" stroke="#6A6A60" stroke-width="1"/>
  <!-- Canto inferior direito dobrado -->
  <polygon points="140,124 154,134 140,134" fill="#3A3A30"/>
  <polygon points="141,125 153,134 141,134" fill="#484840"/>

  <!-- ARRANHÕES no metal -->
  <line x1="50"  y1="70"  x2="82"  y2="66"  stroke="#3C3C34" stroke-width="1.2" opacity="0.8"/>
  <line x1="58"  y1="75"  x2="90"  y2="73"  stroke="#3C3C34" stroke-width="0.8" opacity="0.6"/>
  <line x1="110" y1="108" x2="148" y2="118" stroke="#3C3C34" stroke-width="1"   opacity="0.7"/>
  <line x1="45"  y1="112" x2="75"  y2="128" stroke="#3C3C34" stroke-width="1"   opacity="0.6"/>

  <!-- NÚMERO GRAVADO (estampado a frio — letras com baixo relevo) -->
  <!-- Sombra dos números -->
  <text x="98" y="91" text-anchor="middle" font-family="Georgia,serif" font-size="28"
        fill="#2A2A22" font-weight="bold">1138</text>
  <!-- Número principal -->
  <text x="97" y="90" text-anchor="middle" font-family="Georgia,serif" font-size="28"
        fill="#707068" font-weight="bold">1138</text>
  <!-- Highlight do número (efeito de relevo) -->
  <text x="96" y="89" text-anchor="middle" font-family="Georgia,serif" font-size="28"
        fill="#848478" font-weight="bold" opacity="0.4">1138</text>

  <!-- EMPRESA (texto menor abaixo do número) -->
  <text x="97" y="108" text-anchor="middle" font-family="Georgia,serif"
        font-size="7.5" fill="#3A3A32">CONSOLIDATED COAL CO.</text>
  <line x1="52" y1="112" x2="142" y2="112" stroke="#3A3A32" stroke-width="0.8"/>
  <text x="97" y="120" text-anchor="middle" font-family="Georgia,serif"
        font-size="7" fill="#3A3A32">BREAKER Nº 4 — PA</text>
  <text x="97" y="130" text-anchor="middle" font-family="Georgia,serif"
        font-size="7" fill="#303028">Ano: 1894</text>

  <!-- DIVIDER + INFO -->
  <line x1="14" y1="150" x2="180" y2="150" stroke="#2A2A38" stroke-width="0.8"/>
  <text x="97" y="161" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#50505E">Cena 3 · Artefato histórico · 8–12 anos</text>
</svg>