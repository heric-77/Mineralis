<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="194" height="166" viewBox="0 0 194 166" role="img" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>Lâmpada de Davy</title>
  <desc>Davy Safety Lamp (1815)</desc>

  <!-- HEADER -->
  <rect x="0" y="0" width="194" height="32" rx="8" fill="#1E1A0E"/>
  <rect x="0" y="22" width="194" height="10" fill="#1E1A0E"/>
  <text x="97" y="15" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#C8A028" font-weight="bold">Lâmpada de Davy</text>
  <text x="97" y="27" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#8A7018">Davy Safety Lamp · 1815</text>

  <!-- ARO SUPERIOR (anel de suspensão) -->
  <ellipse cx="97" cy="43" rx="10" ry="6" fill="none" stroke="#A08828" stroke-width="3"/>
  <ellipse cx="97" cy="43" rx="10" ry="6" fill="none" stroke="#C8A830" stroke-width="1.5"/>
  <!-- Haste de conexão -->
  <rect x="94" y="44" width="6" height="10" rx="1" fill="#9A8020"/>

  <!-- CAPUZ SUPERIOR (proteção da chama) -->
  <polygon points="75,56 97,50 119,56 122,64 72,64" fill="#4A3A10"/>
  <polygon points="77,56 97,51 117,56 119,63 75,63" fill="#6A5418"/>
  <polygon points="80,56 97,52 114,56 116,62 78,62" fill="#7A6220"/>
  <!-- Aberturas no capuz -->
  <ellipse cx="97" cy="58" rx="15" ry="4" fill="#2A2008"/>
  <ellipse cx="97" cy="57" rx="12" ry="2.5" fill="#383018"/>

  <!-- CORPO — MALHA DE ARAME (principal diferencial da Lâmpada de Davy) -->
  <!-- Cilindro externo (malha) -->
  <rect x="72" y="64" width="50" height="60" rx="4" fill="#3A3010"/>
  <rect x="74" y="64" width="46" height="58" rx="3" fill="#484018"/>
  <!-- Linhas horizontais de malha -->
  <line x1="74" y1="70"  x2="120" y2="70"  stroke="#2E2808" stroke-width="1.2"/>
  <line x1="74" y1="75"  x2="120" y2="75"  stroke="#2E2808" stroke-width="1.2"/>
  <line x1="74" y1="80"  x2="120" y2="80"  stroke="#2E2808" stroke-width="1.2"/>
  <line x1="74" y1="85"  x2="120" y2="85"  stroke="#2E2808" stroke-width="1.2"/>
  <line x1="74" y1="90"  x2="120" y2="90"  stroke="#2E2808" stroke-width="1.2"/>
  <line x1="74" y1="95"  x2="120" y2="95"  stroke="#2E2808" stroke-width="1.2"/>
  <line x1="74" y1="100" x2="120" y2="100" stroke="#2E2808" stroke-width="1.2"/>
  <line x1="74" y1="105" x2="120" y2="105" stroke="#2E2808" stroke-width="1.2"/>
  <line x1="74" y1="110" x2="120" y2="110" stroke="#2E2808" stroke-width="1.2"/>
  <line x1="74" y1="115" x2="120" y2="115" stroke="#2E2808" stroke-width="1.2"/>
  <!-- Linhas verticais de malha (cruzando) -->
  <line x1="82"  y1="64" x2="82"  y2="122" stroke="#2E2808" stroke-width="1"/>
  <line x1="90"  y1="64" x2="90"  y2="122" stroke="#2E2808" stroke-width="1"/>
  <line x1="97"  y1="64" x2="97"  y2="122" stroke="#2E2808" stroke-width="1"/>
  <line x1="104" y1="64" x2="104" y2="122" stroke="#2E2808" stroke-width="1"/>
  <line x1="112" y1="64" x2="112" y2="122" stroke="#2E2808" stroke-width="1"/>

  <!-- CHAMA (visível através da malha) -->
  <ellipse cx="97" cy="100" rx="10" ry="16" fill="#C86010" opacity="0.85"/>
  <ellipse cx="97" cy="97"  rx="7"  ry="11" fill="#E08820" opacity="0.9"/>
  <ellipse cx="97" cy="94"  rx="4.5" ry="7" fill="#F4B030"/>
  <ellipse cx="97" cy="91"  rx="2.5" ry="4" fill="#FADC60"/>

  <!-- RESERVATÓRIO DE ÓLEO (base) -->
  <ellipse cx="97" cy="122" rx="30" ry="8" fill="#2A2008"/>
  <rect x="68" y="118" width="58" height="12" rx="4" fill="#3A2E10"/>
  <rect x="70" y="119" width="54" height="4" rx="2" fill="#5A4A18"/>
  <!-- BASE INFERIOR -->
  <ellipse cx="97" cy="130" rx="34" ry="10" fill="#2A2008"/>
  <ellipse cx="97" cy="130" rx="30" ry="7" fill="#3A3010"/>
  <rect x="68" y="130" width="58" height="10" rx="3" fill="#484018"/>
  <!-- Base highlight -->
  <ellipse cx="90" cy="131" rx="18" ry="3" fill="#6A5A20" opacity="0.5"/>

  <!-- ALÇA LATERAL -->
  <ellipse cx="97" cy="96" rx="45" ry="22" fill="none" stroke="#5A4818" stroke-width="3"/>
  <ellipse cx="97" cy="96" rx="45" ry="22" fill="none" stroke="#7A6828" stroke-width="1.5"/>

  <!-- DIVIDER + INFO -->
  <line x1="14" y1="150" x2="180" y2="150" stroke="#332A10" stroke-width="0.8"/>
  <text x="97" y="161" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#6A5820">Cena 1 · Obtida no canário · detecta grisú</text>
</svg>