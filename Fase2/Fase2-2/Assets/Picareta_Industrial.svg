<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="194" height="166" viewBox="0 0 194 166" role="img" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <title>Picareta Industrial</title>
  <desc>Ferramenta de mineração de carvão — século XIX</desc>

  <!-- HEADER -->
  <rect x="0" y="0" width="194" height="32" rx="8" fill="#1C1C1C"/>
  <rect x="0" y="22" width="194" height="10" fill="#1C1C1C"/>
  <text x="97" y="15" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#B09870" font-weight="bold">Picareta Industrial</text>
  <text x="97" y="27" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#6A5848">Coal Mining Pick · Séc. XIX</text>

  <!-- CABO (mais grosso e longo que a Fase 1.1) -->
  <!-- Sombra do cabo -->
  <rect x="85" y="88" width="16" height="52" rx="4" fill="#1A1008"/>
  <!-- Cabo principal -->
  <rect x="84" y="86" width="14" height="52" rx="3" fill="#7A4E18"/>
  <rect x="86" y="86" width="10" height="52" rx="2" fill="#9A6428"/>
  <!-- Veios de madeira -->
  <line x1="88" y1="88" x2="87" y2="136" stroke="#7A4E18" stroke-width="1" opacity="0.7"/>
  <line x1="92" y1="87" x2="92" y2="137" stroke="#B07A38" stroke-width="1" opacity="0.5"/>
  <line x1="96" y1="88" x2="95" y2="136" stroke="#7A4E18" stroke-width="1" opacity="0.6"/>

  <!-- ARO DE REFORÇO no cabo (detalhe industrial) -->
  <rect x="83" y="96" width="16" height="6" rx="1" fill="#3A3828"/>
  <rect x="83" y="96" width="16" height="2" rx="1" fill="#5A5848"/>
  <rect x="83" y="118" width="16" height="6" rx="1" fill="#3A3828"/>
  <rect x="83" y="118" width="16" height="2" rx="1" fill="#5A5848"/>

  <!-- CABEÇA DA PICARETA (mais larga e pesada — industrial) -->
  <!-- Sombra da cabeça -->
  <polygon points="28,93 166,93 155,106 38,106" fill="#141412"/>
  <!-- Corpo principal da cabeça -->
  <polygon points="30,92 164,92 152,105 40,105" fill="#383634"/>
  <!-- Face superior (mais clara) -->
  <polygon points="30,92 164,92 156,98 36,98" fill="#4A4846"/>
  <!-- Face frontal (relevo) -->
  <polygon points="36,98 156,98 152,105 40,105" fill="#2E2C2A"/>

  <!-- PONTA ESQUERDA (lado mais pontiagudo para carvão) -->
  <!-- Sombra -->
  <polygon points="28,93 30,105 12,99" fill="#181614"/>
  <!-- Metal -->
  <polygon points="30,92 30,105 8,99" fill="#3A3836"/>
  <polygon points="30,92 30,98 10,98" fill="#4A4846"/>
  <!-- Fio da ponta -->
  <polygon points="8,99 12,97 12,101" fill="#5A5856"/>

  <!-- PONTA DIREITA (lado mais largo — extração em massa) -->
  <!-- Sombra -->
  <polygon points="164,92 166,105 182,88" fill="#181614"/>
  <!-- Metal -->
  <polygon points="164,92 164,105 186,88" fill="#3A3836"/>
  <polygon points="164,92 164,98 184,89" fill="#4A4846"/>
  <!-- Fio da ponta direita (largo) -->
  <polygon points="164,105 186,88 186,94 164,108" fill="#302E2C"/>

  <!-- ENTALHES DE FORJA na cabeça (detalhe industrial autêntico) -->
  <line x1="75"  y1="93" x2="74"  y2="105" stroke="#222020" stroke-width="1.5"/>
  <line x1="97"  y1="92" x2="97"  y2="105" stroke="#222020" stroke-width="1.5"/>
  <line x1="119" y1="93" x2="120" y2="105" stroke="#222020" stroke-width="1.5"/>

  <!-- REBITES na junção cabo/cabeça -->
  <circle cx="87" cy="93" r="3.5" fill="#2A2828"/>
  <circle cx="87" cy="93" r="2"   fill="#3A3838"/>
  <circle cx="87" cy="93" r="1"   fill="#5A5858"/>
  <circle cx="107" cy="93" r="3.5" fill="#2A2828"/>
  <circle cx="107" cy="93" r="2"   fill="#3A3838"/>
  <circle cx="107" cy="93" r="1"   fill="#5A5858"/>

  <!-- DIVIDER + INFO -->
  <line x1="14" y1="150" x2="180" y2="150" stroke="#303028" stroke-width="0.8"/>
  <text x="97" y="161" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#585048">Fase 2.2 · Mais pesada que a Fase 1.1</text>
</svg>