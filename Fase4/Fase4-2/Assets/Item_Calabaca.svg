<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Calabaça de Água</title>

  <!-- Sombra base -->
  <rect x="36" y="172" width="128" height="8" fill="#1A1408" opacity="0.2"/>

  <!-- ===== CALABAÇA (CABAÇA) - formato típico de garrafão ===== -->
  <!-- Corpo inferior grande - a barriga da cabaça -->

  <!-- Corpo inferior (grande, redondo) -->
  <rect x="52"  y="100" width="96"  height="64" fill="#8B6A20"/>
  <rect x="44"  y="96"  width="112" height="72" fill="#9A7828"/>
  <rect x="40"  y="92"  width="120" height="80" fill="#A88430"/>
  <rect x="36"  y="88"  width="128" height="84" fill="#B08C38"/>
  <rect x="36"  y="84"  width="128" height="12" fill="#A88430"/>
  <rect x="40"  y="80"  width="120" height="8"  fill="#9A7828"/>
  <rect x="48"  y="76"  width="104" height="8"  fill="#8B6A20"/>
  <rect x="60"  y="72"  width="80"  height="8"  fill="#7A5C18"/>
  <rect x="72"  y="68"  width="56"  height="8"  fill="#6A5014"/>

  <!-- Base arredondada -->
  <rect x="52"  y="160" width="96"  height="8"  fill="#9A7828"/>
  <rect x="60"  y="164" width="80"  height="8"  fill="#8B6A20"/>
  <rect x="72"  y="168" width="56"  height="6"  fill="#7A5C18"/>
  <rect x="84"  y="170" width="32"  height="4"  fill="#6A5014"/>

  <!-- ===== GARGALO (parte superior estreita) ===== -->
  <rect x="84"  y="52"  width="32"  height="20" fill="#8B6A20"/>
  <rect x="88"  y="48"  width="24"  height="24" fill="#9A7828"/>
  <rect x="92"  y="44"  width="16"  height="8"  fill="#8B6A20"/>

  <!-- Anel decorativo no gargalo -->
  <rect x="84"  y="60"  width="32"  height="4"  fill="#C4963A"/>
  <rect x="82"  y="62"  width="36"  height="4"  fill="#D4A640"/>
  <rect x="80"  y="64"  width="40"  height="4"  fill="#C4963A"/>

  <!-- ===== ROLHA / TAMPA ===== -->
  <!-- Rolha de palha trançada -->
  <rect x="88"  y="36"  width="24"  height="12" fill="#D4B050"/>
  <rect x="86"  y="38"  width="28"  height="10" fill="#E0C060"/>
  <rect x="84"  y="40"  width="32"  height="8"  fill="#CCA848"/>
  <!-- Textura trança -->
  <rect x="88"  y="37"  width="4"   height="12" fill="#B89040" opacity="0.5"/>
  <rect x="96"  y="37"  width="4"   height="12" fill="#B89040" opacity="0.5"/>
  <rect x="104" y="37"  width="4"   height="12" fill="#B89040" opacity="0.5"/>
  <rect x="86"  y="40"  width="28"  height="2"  fill="#D4B050" opacity="0.5"/>
  <rect x="86"  y="44"  width="28"  height="2"  fill="#D4B050" opacity="0.5"/>

  <!-- Cordinha da rolha -->
  <rect x="98"  y="28"  width="4"   height="12" fill="#9A7030"/>
  <rect x="96"  y="26"  width="8"   height="4"  fill="#9A7030"/>
  <rect x="98"  y="22"  width="4"   height="6"  fill="#8A6028"/>
  <!-- Nozinho -->
  <rect x="94"  y="20"  width="12"  height="6"  fill="#9A7030"/>
  <rect x="96"  y="18"  width="8"   height="4"  fill="#B08038"/>

  <!-- ===== TEXTURA E COSTELAS DA CABAÇA ===== -->
  <!-- Listras verticais naturais (cabaça seca tem costelas) -->
  <!-- Costela 1 - esquerda -->
  <rect x="52"  y="80"  width="4"   height="88" fill="#9A7828" opacity="0.4"/>
  <rect x="48"  y="88"  width="4"   height="72" fill="#8B6A20" opacity="0.3"/>
  <!-- Costela 2 -->
  <rect x="72"  y="72"  width="4"   height="96" fill="#9A7828" opacity="0.35"/>
  <!-- Costela 3 - centro-esq -->
  <rect x="88"  y="68"  width="4"   height="100" fill="#C4963A" opacity="0.25"/>
  <!-- Costela 4 - centro-dir -->
  <rect x="108" y="68"  width="4"   height="100" fill="#C4963A" opacity="0.25"/>
  <!-- Costela 5 -->
  <rect x="124" y="72"  width="4"   height="96" fill="#9A7828" opacity="0.35"/>
  <!-- Costela 6 - direita -->
  <rect x="144" y="80"  width="4"   height="88" fill="#9A7828" opacity="0.4"/>
  <rect x="148" y="88"  width="4"   height="72" fill="#8B6A20" opacity="0.3"/>

  <!-- Linhas horizontais suaves (textura cabaça) -->
  <rect x="40"  y="104" width="120" height="2"  fill="#C4963A" opacity="0.3"/>
  <rect x="40"  y="120" width="120" height="2"  fill="#C4963A" opacity="0.3"/>
  <rect x="44"  y="136" width="112" height="2"  fill="#C4963A" opacity="0.3"/>
  <rect x="52"  y="150" width="96"  height="2"  fill="#C4963A" opacity="0.3"/>

  <!-- ===== LUZ E SOMBRA (volume da cabaça) ===== -->
  <!-- Brilho - lado esquerdo superior (luz) -->
  <rect x="56"  y="84"  width="28"  height="32" fill="#D4A840" opacity="0.3"/>
  <rect x="60"  y="80"  width="20"  height="24" fill="#E0B848" opacity="0.25"/>
  <rect x="64"  y="76"  width="12"  height="16" fill="#EEC850" opacity="0.2"/>

  <!-- Sombra - lado direito inferior -->
  <rect x="120" y="108" width="32"  height="56" fill="#6A5018" opacity="0.25"/>
  <rect x="132" y="96"  width="20"  height="72" fill="#5A4010" opacity="0.2"/>

  <!-- ===== PADRÃO DECORATIVO SHONA pintado na cabaça ===== -->
  <!-- Faixa decorativa ao redor do meio -->
  <rect x="44"  y="110" width="112" height="6"  fill="#7A5018" opacity="0.5"/>
  <!-- Triângulos geométricos alternados (estilo Shona) -->
  <rect x="52"  y="112" width="6"   height="4"  fill="#4A3010" opacity="0.7"/>
  <rect x="64"  y="112" width="6"   height="4"  fill="#4A3010" opacity="0.7"/>
  <rect x="76"  y="112" width="6"   height="4"  fill="#4A3010" opacity="0.7"/>
  <rect x="88"  y="112" width="6"   height="4"  fill="#4A3010" opacity="0.7"/>
  <rect x="100" y="112" width="6"   height="4"  fill="#4A3010" opacity="0.7"/>
  <rect x="112" y="112" width="6"   height="4"  fill="#4A3010" opacity="0.7"/>
  <rect x="124" y="112" width="6"   height="4"  fill="#4A3010" opacity="0.7"/>
  <rect x="136" y="112" width="6"   height="4"  fill="#4A3010" opacity="0.7"/>
  <!-- Pontos decorativos entre triângulos -->
  <rect x="58"  y="113" width="4"   height="2"  fill="#E0B030" opacity="0.5"/>
  <rect x="70"  y="113" width="4"   height="2"  fill="#E0B030" opacity="0.5"/>
  <rect x="82"  y="113" width="4"   height="2"  fill="#E0B030" opacity="0.5"/>
  <rect x="94"  y="113" width="4"   height="2"  fill="#E0B030" opacity="0.5"/>
  <rect x="106" y="113" width="4"   height="2"  fill="#E0B030" opacity="0.5"/>
  <rect x="118" y="113" width="4"   height="2"  fill="#E0B030" opacity="0.5"/>
  <rect x="130" y="113" width="4"   height="2"  fill="#E0B030" opacity="0.5"/>

  <!-- GOTINHA de água escorrendo -->
  <rect x="150" y="96"  width="4"   height="10" fill="#6EB0C0" opacity="0.5"/>
  <rect x="152" y="104" width="2"   height="4"  fill="#5A9AAA" opacity="0.4"/>

</svg>
