<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Compass Solar Shona (Bastão de Sombra)</title>

  <!-- Sombra base -->
  <rect x="40" y="174" width="120" height="8" fill="#1A1408" opacity="0.2"/>

  <!-- ===== CHÃO / BASE - terra do planalto ===== -->
  <rect x="20" y="164" width="160" height="16" fill="#7A6030"/>
  <rect x="24" y="168" width="152" height="12" fill="#8A7038"/>
  <!-- Textura de solo -->
  <rect x="32" y="165" width="12" height="4" fill="#6A5028"/>
  <rect x="80" y="166" width="10" height="4" fill="#6A5028"/>
  <rect x="140" y="165" width="14" height="4" fill="#6A5028"/>
  <rect x="56" y="167" width="8"  height="3" fill="#9A8040"/>
  <rect x="116" y="167" width="8" height="3" fill="#9A8040"/>

  <!-- ===== MARCAÇÕES DE SOMBRA NO CHÃO ===== -->
  <!-- Linha de sombra projetada (indicador N/S) -->
  <!-- Sombra do bastão - linha longa para o norte -->
  <rect x="98" y="60" width="4" height="108" fill="#3A2C10" opacity="0.6"/>
  <rect x="97" y="64" width="6" height="100" fill="#4A3C18" opacity="0.4"/>

  <!-- Marcações semicirculares no chão (horas do dia) -->
  <!-- Arco representado com segmentos pixel art -->
  <!-- Segmentos do arco de horas - linha sul (trás) -->
  <rect x="60" y="156" width="8"  height="6" fill="#5A4820" opacity="0.7"/>
  <rect x="76" y="153" width="8"  height="6" fill="#5A4820" opacity="0.7"/>
  <rect x="92" y="152" width="8"  height="5" fill="#5A4820" opacity="0.7"/>
  <rect x="108" y="152" width="8" height="5" fill="#5A4820" opacity="0.7"/>
  <rect x="124" y="153" width="8" height="6" fill="#5A4820" opacity="0.7"/>
  <rect x="140" y="156" width="8" height="6" fill="#5A4820" opacity="0.7"/>

  <!-- Marcações de horas - pedrinhas entalhadas -->
  <rect x="62"  y="155" width="4" height="4" fill="#D4A830"/><!-- S -->
  <rect x="78"  y="152" width="4" height="4" fill="#C89820"/>
  <rect x="94"  y="151" width="4" height="4" fill="#D4A830"/>
  <rect x="100" y="150" width="4" height="4" fill="#E0B840"/><!-- Meio-dia / Norte -->
  <rect x="110" y="151" width="4" height="4" fill="#D4A830"/>
  <rect x="126" y="152" width="4" height="4" fill="#C89820"/>
  <rect x="142" y="155" width="4" height="4" fill="#D4A830"/><!-- S -->

  <!-- Raios indicadores de hora (linhas no chão) -->
  <!-- Hora do nascer (E) -->
  <rect x="100" y="155" width="40" height="2" fill="#7A5C20" opacity="0.5"/>
  <!-- Meio-dia (N no hemisfério sul) -->
  <rect x="100" y="80"  width="2"  height="76" fill="#7A5C20" opacity="0.6"/>
  <!-- Pôr do sol (O) -->
  <rect x="60"  y="155" width="42" height="2" fill="#7A5C20" opacity="0.5"/>

  <!-- ===== BASTÃO PRINCIPAL - madeira de mopane ===== -->
  <!-- Fincado no chão, vertical -->
  <!-- Sombra lateral do bastão -->
  <rect x="105" y="20" width="4" height="148" fill="#2A2010" opacity="0.35"/>

  <!-- Corpo do bastão - madeira escura de mopane -->
  <rect x="98"  y="16" width="8" height="152" fill="#5A3A18"/>
  <rect x="100" y="16" width="4" height="152" fill="#6A4A20"/>
  <!-- Veio da madeira -->
  <rect x="99"  y="24" width="2" height="60"  fill="#7A5A28" opacity="0.6"/>
  <rect x="103" y="50" width="2" height="40"  fill="#4A2E14" opacity="0.6"/>
  <rect x="99"  y="96" width="2" height="48"  fill="#7A5A28" opacity="0.5"/>
  <rect x="103" y="104" width="2" height="36" fill="#4A2E14" opacity="0.5"/>

  <!-- Topo do bastão - chanfrado/apontado -->
  <rect x="99"  y="12" width="6" height="8"  fill="#6A4820"/>
  <rect x="100" y="8"  width="4" height="8"  fill="#7A5828"/>
  <rect x="101" y="4"  width="2" height="8"  fill="#8A6830"/>
  <rect x="101" y="2"  width="2" height="4"  fill="#9A7838"/>

  <!-- Base do bastão (fincada no chão) - mais grossa -->
  <rect x="96"  y="148" width="12" height="8"  fill="#4A2E14"/>
  <rect x="94"  y="154" width="16" height="8"  fill="#3A2010"/>
  <rect x="92"  y="160" width="20" height="6"  fill="#2E1A0C"/>

  <!-- ===== MARCAÇÕES ENTALHADAS no bastão ===== -->
  <!-- Entalhes decorativos Shona -->
  <rect x="98"  y="40"  width="8" height="3"  fill="#3A2810"/>
  <rect x="98"  y="56"  width="8" height="3"  fill="#3A2810"/>
  <rect x="98"  y="72"  width="8" height="3"  fill="#3A2810"/>
  <rect x="98"  y="88"  width="8" height="3"  fill="#3A2810"/>
  <rect x="98"  y="104" width="8" height="3"  fill="#3A2810"/>
  <rect x="98"  y="120" width="8" height="3"  fill="#3A2810"/>

  <!-- ===== SOL (indicando função solar) ===== -->
  <!-- Disco solar pequeno acima -->
  <rect x="24" y="20" width="28" height="28" fill="#F0C820"/>
  <rect x="28" y="16" width="20" height="36" fill="#F8D428"/>
  <rect x="16" y="28" width="36" height="16" fill="#F8D428"/>
  <!-- Brilho central -->
  <rect x="32" y="24" width="12" height="12" fill="#FFEC60"/>
  <rect x="36" y="28" width="4"  height="4"  fill="#FFFFFF" opacity="0.8"/>
  <!-- Raios do sol - pixel art -->
  <rect x="36" y="8"  width="4" height="8"  fill="#F0C820"/><!-- cima -->
  <rect x="36" y="56" width="4" height="8"  fill="#F0C820"/><!-- baixo -->
  <rect x="8"  y="32" width="8" height="4"  fill="#F0C820"/><!-- esq -->
  <rect x="56" y="32" width="8" height="4"  fill="#F0C820"/><!-- dir -->
  <rect x="14" y="14" width="6" height="6"  fill="#F0C820"/><!-- NW -->
  <rect x="52" y="14" width="6" height="6"  fill="#F0C820"/><!-- NE -->
  <rect x="14" y="52" width="6" height="6"  fill="#F0C820"/><!-- SW -->
  <rect x="52" y="52" width="6" height="6"  fill="#F0C820"/><!-- SE -->

  <!-- ===== INDICADORES DE DIREÇÃO (N/S no hemi sul) ===== -->
  <!-- "N" no chão (direção da sombra ao meio-dia) -->
  <rect x="96" y="56" width="2" height="12" fill="#D4A830" opacity="0.8"/>
  <rect x="102" y="56" width="2" height="12" fill="#D4A830" opacity="0.8"/>
  <rect x="96" y="56" width="8" height="2"  fill="#D4A830" opacity="0.8"/>
  <rect x="96" y="62" width="8" height="2"  fill="#D4A830" opacity="0.8"/>

  <!-- Linha indicadora no chão apontando Norte (em direção à câmara) -->
  <!-- Flecha de indicação -->
  <rect x="100" y="58" width="2" height="84" fill="#E0B840" opacity="0.7"/>
  <rect x="96"  y="62" width="10" height="2" fill="#E0B840" opacity="0.7"/>

</svg>
