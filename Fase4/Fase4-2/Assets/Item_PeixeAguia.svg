<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Peixe-Águia Africano (African Fish Eagle)</title>

  <!-- Sombra base -->
  <rect x="30" y="168" width="140" height="8" fill="#1A1408" opacity="0.2"/>

  <!-- ===== ASA ESQUERDA (aberta e levantada) ===== -->
  <!-- Coberteiras superiores - marrom escuro -->
  <rect x="8"  y="72" width="68" height="12" fill="#3A1C0A"/>
  <rect x="8"  y="80" width="68" height="12" fill="#2A1208"/>
  <!-- Coberteiras médias - castanho-avermelhado -->
  <rect x="8"  y="88" width="68" height="10" fill="#8B3A10"/>
  <rect x="8"  y="94" width="64" height="10" fill="#7A3010"/>
  <!-- Rêmiges primárias - preto intenso -->
  <rect x="8"  y="100" width="68" height="28" fill="#140E06"/>
  <!-- Detalhes separação de penas -->
  <rect x="12" y="100" width="4" height="28" fill="#1E1208"/>
  <rect x="20" y="100" width="4" height="28" fill="#1E1208"/>
  <rect x="28" y="100" width="4" height="26" fill="#1E1208"/>
  <rect x="36" y="100" width="4" height="24" fill="#1E1208"/>
  <rect x="44" y="100" width="4" height="20" fill="#1E1208"/>
  <rect x="52" y="100" width="4" height="16" fill="#1E1208"/>
  <rect x="60" y="100" width="4" height="10" fill="#1E1208"/>
  <!-- Borda superior asa esq -->
  <rect x="8"  y="68" width="56" height="8"  fill="#4A2410"/>
  <rect x="16" y="62" width="44" height="8"  fill="#3A1C0A"/>
  <rect x="24" y="56" width="32" height="8"  fill="#341808"/>

  <!-- ===== ASA DIREITA (aberta e levantada) ===== -->
  <rect x="124" y="72" width="68" height="12" fill="#3A1C0A"/>
  <rect x="124" y="80" width="68" height="12" fill="#2A1208"/>
  <rect x="128" y="88" width="68" height="10" fill="#8B3A10"/>
  <rect x="128" y="94" width="64" height="10" fill="#7A3010"/>
  <rect x="124" y="100" width="68" height="28" fill="#140E06"/>
  <rect x="124" y="100" width="4" height="10" fill="#1E1208"/>
  <rect x="132" y="100" width="4" height="16" fill="#1E1208"/>
  <rect x="140" y="100" width="4" height="20" fill="#1E1208"/>
  <rect x="148" y="100" width="4" height="24" fill="#1E1208"/>
  <rect x="156" y="100" width="4" height="26" fill="#1E1208"/>
  <rect x="164" y="100" width="4" height="28" fill="#1E1208"/>
  <rect x="172" y="100" width="4" height="28" fill="#1E1208"/>
  <rect x="136" y="68" width="56" height="8"  fill="#4A2410"/>
  <rect x="140" y="62" width="44" height="8"  fill="#3A1C0A"/>
  <rect x="144" y="56" width="32" height="8"  fill="#341808"/>

  <!-- ===== CORPO ===== -->
  <!-- Costas / manto escuro -->
  <rect x="76" y="80" width="48" height="48" fill="#2A1208"/>
  <rect x="80" y="76" width="40" height="56" fill="#341408"/>

  <!-- Barriga / flancos castanho-avermelhado -->
  <rect x="76" y="100" width="48" height="40" fill="#9A4214"/>
  <rect x="72" y="108" width="56" height="28" fill="#A44A18"/>

  <!-- Peito branco-creme (característica marcante) -->
  <rect x="80" y="96" width="40" height="36" fill="#F0ECD8"/>
  <rect x="84" y="92" width="32" height="44" fill="#F4F0E0"/>
  <rect x="80" y="92" width="40" height="8"  fill="#EEE8D6"/>

  <!-- ===== PESCOÇO E CABEÇA ===== -->
  <!-- Pescoço branco -->
  <rect x="84" y="68" width="32" height="24" fill="#F4F0E0"/>
  <rect x="80" y="72" width="40" height="16" fill="#F0ECD8"/>

  <!-- Cabeça branca -->
  <rect x="80" y="40" width="40" height="32" fill="#F4F0E0"/>
  <rect x="84" y="36" width="32" height="8"  fill="#F0ECD8"/>
  <rect x="88" y="32" width="24" height="8"  fill="#E8E4D2"/>

  <!-- Máscara preta ao redor dos olhos (característica do Peixe-Águia) -->
  <rect x="80" y="44" width="20" height="14" fill="#161008"/>
  <rect x="80" y="40" width="16" height="8"  fill="#161008"/>

  <!-- Olho - amarelo intenso -->
  <rect x="82" y="46" width="12" height="10" fill="#F0C020"/>
  <rect x="84" y="48" width="8"  height="8"  fill="#F8CC28"/>
  <!-- Pupila -->
  <rect x="86" y="49" width="4"  height="4"  fill="#080604"/>
  <!-- Brilho -->
  <rect x="87" y="49" width="2"  height="2"  fill="#FFFFFF" opacity="0.9"/>

  <!-- ===== BICO CURVADO - amarelo/laranja ===== -->
  <!-- Bico superior (curvado para baixo) -->
  <rect x="68" y="48" width="16" height="8"  fill="#E8A010"/>
  <rect x="60" y="52" width="14" height="6"  fill="#D89008"/>
  <rect x="52" y="55" width="12" height="5"  fill="#C88008"/>
  <rect x="46" y="57" width="10" height="5"  fill="#B87008"/>
  <rect x="42" y="60" width="8"  height="5"  fill="#A86008"/>
  <rect x="40" y="63" width="6"  height="4"  fill="#986010"/>
  <!-- Bico inferior (menor) -->
  <rect x="62" y="56" width="10" height="5"  fill="#C88010"/>
  <rect x="56" y="59" width="8"  height="4"  fill="#B87010"/>
  <!-- Fio da cera (base do bico) -->
  <rect x="74" y="47" width="6"  height="4"  fill="#D0A820" opacity="0.8"/>

  <!-- ===== CAUDA (branca com faixas) ===== -->
  <rect x="84" y="132" width="32" height="8"  fill="#F0ECD8"/>
  <rect x="80" y="136" width="40" height="8"  fill="#F4F0E0"/>
  <rect x="76" y="140" width="48" height="8"  fill="#E8E4D2"/>
  <rect x="80" y="144" width="40" height="8"  fill="#D8D4C2"/>
  <rect x="84" y="148" width="32" height="6"  fill="#C8C4B2"/>
  <!-- Divisões penas cauda -->
  <rect x="84" y="132" width="4"  height="24" fill="#DDD8C8"/>
  <rect x="92" y="132" width="4"  height="26" fill="#DDD8C8"/>
  <rect x="100" y="132" width="4" height="26" fill="#DDD8C8"/>
  <rect x="108" y="132" width="4" height="24" fill="#DDD8C8"/>

  <!-- ===== PATAS E GARRAS - amarelo forte ===== -->
  <!-- Canela esquerda -->
  <rect x="84" y="128" width="8" height="18" fill="#E0A010"/>
  <!-- Dedos esquerda -->
  <rect x="76" y="143" width="16" height="5" fill="#E0A010"/><!-- frente -->
  <rect x="84" y="143" width="14" height="5" fill="#E0A010"/><!-- lateral -->
  <rect x="84" y="146" width="6"  height="8" fill="#E0A010"/><!-- traseiro -->
  <!-- Garras esq -->
  <rect x="72" y="146" width="6"  height="4" fill="#C88808"/>
  <rect x="82" y="148" width="4"  height="6" fill="#C88808"/>
  <rect x="90" y="146" width="6"  height="4" fill="#C88808"/>
  <rect x="82" y="153" width="4"  height="4" fill="#C88808"/>

  <!-- Canela direita -->
  <rect x="108" y="128" width="8" height="18" fill="#E0A010"/>
  <!-- Dedos direita -->
  <rect x="108" y="143" width="16" height="5" fill="#E0A010"/>
  <rect x="102" y="143" width="14" height="5" fill="#E0A010"/>
  <rect x="110" y="146" width="6"  height="8" fill="#E0A010"/>
  <!-- Garras dir -->
  <rect x="100" y="146" width="6"  height="4" fill="#C88808"/>
  <rect x="108" y="148" width="4"  height="6" fill="#C88808"/>
  <rect x="116" y="146" width="6"  height="4" fill="#C88808"/>
  <rect x="110" y="153" width="4"  height="4" fill="#C88808"/>

</svg>
