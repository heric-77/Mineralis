<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
  <title>Pássaro de Esteatita do Zimbabué</title>

  <!-- Sombra base -->
  <rect x="44" y="180" width="112" height="8" fill="#1A1408" opacity="0.22"/>

  <!-- ===== PEDESTAL / BASE ===== -->
  <!-- Base cilíndrica de esteatita -->
  <rect x="60"  y="164" width="80"  height="16" fill="#5A5848"/>
  <rect x="56"  y="160" width="88"  height="8"  fill="#6A6858"/>
  <rect x="52"  y="156" width="96"  height="8"  fill="#787668"/>
  <rect x="56"  y="152" width="88"  height="8"  fill="#686658"/>
  <!-- Faixa decorativa na base -->
  <rect x="52"  y="152" width="96"  height="4"  fill="#4A4838"/>
  <rect x="56"  y="150" width="88"  height="4"  fill="#545242"/>
  <!-- Padrão entalhado na base -->
  <rect x="60"  y="151" width="4"   height="3"  fill="#3A3828"/>
  <rect x="68"  y="151" width="4"   height="3"  fill="#3A3828"/>
  <rect x="76"  y="151" width="4"   height="3"  fill="#3A3828"/>
  <rect x="84"  y="151" width="4"   height="3"  fill="#3A3828"/>
  <rect x="92"  y="151" width="4"   height="3"  fill="#3A3828"/>
  <rect x="100" y="151" width="4"   height="3"  fill="#3A3828"/>
  <rect x="108" y="151" width="4"   height="3"  fill="#3A3828"/>
  <rect x="116" y="151" width="4"   height="3"  fill="#3A3828"/>
  <rect x="124" y="151" width="4"   height="3"  fill="#3A3828"/>
  <!-- Linha decorativa -->
  <rect x="56"  y="154" width="88"  height="2"  fill="#8A8878" opacity="0.5"/>

  <!-- ===== CORPO DO PÁSSARO - esteatita cinza-esverdeada ===== -->
  <!-- Pedestal / coluna -->
  <rect x="88"  y="132" width="24"  height="24" fill="#6A6858"/>
  <rect x="84"  y="128" width="32"  height="28" fill="#747268"/>
  <rect x="80"  y="124" width="40"  height="32" fill="#7A7868"/>

  <!-- Corpo principal do pássaro (oval) -->
  <rect x="68"  y="88"  width="64"  height="40" fill="#7A7868"/>
  <rect x="64"  y="84"  width="72"  height="48" fill="#848278"/>
  <rect x="60"  y="80"  width="80"  height="56" fill="#8E8C80"/>
  <rect x="60"  y="76"  width="80"  height="12" fill="#848278"/>
  <rect x="64"  y="72"  width="72"  height="8"  fill="#7A7868"/>
  <rect x="72"  y="68"  width="56"  height="8"  fill="#6E6C5C"/>

  <!-- Detalhe do peito - leve destaque -->
  <rect x="76"  y="96"  width="48"  height="24" fill="#969488"/>
  <rect x="80"  y="100" width="40"  height="16" fill="#9E9C8E"/>

  <!-- ASAS esculpidas - baixo relevo nas laterais -->
  <!-- Asa esquerda (entalhe no corpo) -->
  <rect x="56"  y="84"  width="12"  height="36" fill="#6A6858"/>
  <rect x="52"  y="88"  width="12"  height="28" fill="#5A5848"/>
  <rect x="48"  y="92"  width="12"  height="20" fill="#5A5848"/>
  <!-- Detalhe penas asa esq -->
  <rect x="52"  y="90"  width="4"   height="6"  fill="#6E6C5C" opacity="0.7"/>
  <rect x="52"  y="100" width="4"   height="6"  fill="#6E6C5C" opacity="0.7"/>
  <rect x="52"  y="110" width="4"   height="6"  fill="#6E6C5C" opacity="0.7"/>
  <rect x="56"  y="88"  width="4"   height="5"  fill="#4A4838" opacity="0.6"/>
  <rect x="56"  y="97"  width="4"   height="5"  fill="#4A4838" opacity="0.6"/>
  <rect x="56"  y="106" width="4"   height="5"  fill="#4A4838" opacity="0.6"/>

  <!-- Asa direita (entalhe no corpo) -->
  <rect x="132" y="84"  width="12"  height="36" fill="#6A6858"/>
  <rect x="136" y="88"  width="12"  height="28" fill="#5A5848"/>
  <rect x="140" y="92"  width="12"  height="20" fill="#5A5848"/>
  <!-- Detalhe penas asa dir -->
  <rect x="144" y="90"  width="4"   height="6"  fill="#6E6C5C" opacity="0.7"/>
  <rect x="144" y="100" width="4"   height="6"  fill="#6E6C5C" opacity="0.7"/>
  <rect x="144" y="110" width="4"   height="6"  fill="#6E6C5C" opacity="0.7"/>
  <rect x="140" y="88"  width="4"   height="5"  fill="#4A4838" opacity="0.6"/>
  <rect x="140" y="97"  width="4"   height="5"  fill="#4A4838" opacity="0.6"/>
  <rect x="140" y="106" width="4"   height="5"  fill="#4A4838" opacity="0.6"/>

  <!-- ===== PESCOÇO ===== -->
  <rect x="84"  y="60"  width="32"  height="20" fill="#848278"/>
  <rect x="88"  y="56"  width="24"  height="8"  fill="#7A7868"/>
  <rect x="84"  y="56"  width="32"  height="8"  fill="#7A7868"/>

  <!-- ===== CABEÇA HUMANA (característica: meio gavião, meio humano) ===== -->
  <!-- Cabeça redonda - traços humanos esculpidos em esteatita -->
  <rect x="80"  y="28"  width="40"  height="36" fill="#8E8C80"/>
  <rect x="76"  y="32"  width="48"  height="32" fill="#96948A"/>
  <rect x="76"  y="28"  width="48"  height="8"  fill="#8E8C80"/>
  <rect x="80"  y="24"  width="40"  height="8"  fill="#848278"/>
  <rect x="84"  y="20"  width="32"  height="8"  fill="#7A7868"/>

  <!-- Traços faciais humanos esculpidos -->
  <!-- Sobrancelhas entalhadas -->
  <rect x="84"  y="36"  width="10"  height="3"  fill="#5A5848"/>
  <rect x="106" y="36"  width="10"  height="3"  fill="#5A5848"/>

  <!-- Olhos (grandes, estilizados - estilo Shona) -->
  <rect x="84"  y="40"  width="12"  height="10" fill="#4A4838"/>
  <rect x="86"  y="42"  width="8"   height="8"  fill="#3A3828"/>
  <!-- Detalhe do olho esq -->
  <rect x="88"  y="43"  width="4"   height="4"  fill="#2A2818"/>
  <rect x="89"  y="43"  width="2"   height="2"  fill="#8A8878" opacity="0.7"/><!-- brilho -->

  <rect x="104" y="40"  width="12"  height="10" fill="#4A4838"/>
  <rect x="106" y="42"  width="8"   height="8"  fill="#3A3828"/>
  <rect x="108" y="43"  width="4"   height="4"  fill="#2A2818"/>
  <rect x="109" y="43"  width="2"   height="2"  fill="#8A8878" opacity="0.7"/>

  <!-- Nariz esculpido -->
  <rect x="96"  y="46"  width="8"   height="6"  fill="#6A6858"/>
  <rect x="94"  y="50"  width="12"  height="4"  fill="#5A5848"/>

  <!-- Boca / lábios esculpidos -->
  <rect x="90"  y="54"  width="20"  height="4"  fill="#4A4838"/>
  <rect x="92"  y="56"  width="16"  height="4"  fill="#5A5848"/>

  <!-- ===== CRISTA / PENAS DA CABEÇA (traço de gavião) ===== -->
  <rect x="88"  y="16"  width="8"   height="8"  fill="#6A6858"/>
  <rect x="92"  y="12"  width="8"   height="8"  fill="#747268"/>
  <rect x="96"  y="8"   width="8"   height="8"  fill="#6A6858"/>
  <rect x="100" y="4"   width="6"   height="8"  fill="#5A5848"/>
  <rect x="84"  y="18"  width="6"   height="6"  fill="#7A7868"/>
  <rect x="108" y="14"  width="6"   height="8"  fill="#6A6858"/>
  <rect x="112" y="10"  width="4"   height="8"  fill="#5A5848"/>

  <!-- ===== BICO DE GAVIÃO (cabeça humana mas com bico) ===== -->
  <rect x="76"  y="44"  width="8"   height="6"  fill="#7A7868"/>
  <rect x="70"  y="46"  width="8"   height="5"  fill="#6A6858"/>
  <rect x="64"  y="48"  width="8"   height="4"  fill="#5A5848"/>
  <rect x="60"  y="50"  width="6"   height="4"  fill="#4A4838"/>
  <rect x="58"  y="52"  width="4"   height="4"  fill="#3A3828"/>

  <!-- ===== LUZ E SOMBRA na pedra (esteatita polida) ===== -->
  <!-- Brilho leve na superfície polida -->
  <rect x="72"  y="80"  width="16"  height="24" fill="#A0A090" opacity="0.3"/>
  <rect x="76"  y="76"  width="12"  height="16" fill="#B0AEA0" opacity="0.2"/>
  <!-- Reflexo no pescoço -->
  <rect x="90"  y="58"  width="8"   height="12" fill="#A0A090" opacity="0.25"/>

  <!-- Sombra lateral direita -->
  <rect x="128" y="84"  width="8"   height="48" fill="#5A5848" opacity="0.3"/>
  <rect x="116" y="120" width="20"  height="12" fill="#5A5848" opacity="0.25"/>

  <!-- ===== GARRAS ESCULPIDAS (patas de gavião) ===== -->
  <!-- Garra esquerda -->
  <rect x="76"  y="132" width="8"   height="16" fill="#686658"/>
  <rect x="68"  y="145" width="12"  height="5"  fill="#686658"/>
  <rect x="76"  y="145" width="10"  height="5"  fill="#686658"/>
  <rect x="80"  y="148" width="6"   height="8"  fill="#686658"/>
  <!-- Pontinhos garras -->
  <rect x="64"  y="148" width="4"   height="4"  fill="#4A4838"/>
  <rect x="74"  y="151" width="4"   height="4"  fill="#4A4838"/>
  <rect x="84"  y="153" width="4"   height="4"  fill="#4A4838"/>

  <!-- Garra direita -->
  <rect x="116" y="132" width="8"   height="16" fill="#686658"/>
  <rect x="120" y="145" width="12"  height="5"  fill="#686658"/>
  <rect x="110" y="145" width="12"  height="5"  fill="#686658"/>
  <rect x="114" y="148" width="6"   height="8"  fill="#686658"/>
  <rect x="132" y="148" width="4"   height="4"  fill="#4A4838"/>
  <rect x="122" y="151" width="4"   height="4"  fill="#4A4838"/>
  <rect x="112" y="153" width="4"   height="4"  fill="#4A4838"/>

  <!-- ===== MARCAS DE ENTALHE sutis - textura artesanal ===== -->
  <!-- Entalhe espiral no corpo (motivo ancestral Shona) -->
  <rect x="96"  y="92"  width="2"   height="10" fill="#6A6858" opacity="0.5"/>
  <rect x="92"  y="96"  width="10"  height="2"  fill="#6A6858" opacity="0.5"/>
  <rect x="96"  y="92"  width="10"  height="2"  fill="#6A6858" opacity="0.4"/>
  <rect x="104" y="92"  width="2"   height="8"  fill="#6A6858" opacity="0.4"/>
  <rect x="100" y="98"  width="6"   height="2"  fill="#6A6858" opacity="0.4"/>

</svg>
