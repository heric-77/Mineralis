<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1456"
   viewBox="0 0 1456 839"
   height="839"
   role="img"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>Fase 4.3 Cena 02 – Minas de Sal de Taoudenni, deserto branco absoluto</title>
  <desc>Pixel art 2D – Deserto de sal do Saara, estratos horizontais de halita, trabalhadores tuaregues cortando lajes. Fundo sem personagens.</desc>

  <defs>
    <!-- Halita branca – cristais cúbicos visíveis -->
    <pattern id="pHalita" x="0" y="0" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#E8E4D8"/>
      <rect width="48" height="1" fill="#C8C0A8"/>
      <rect y="12" width="48" height="1" fill="#C8C0A8"/>
      <rect width="1" height="12" fill="#C8C0A8"/>
      <rect x="47" width="1" height="12" fill="#C8C0A8"/>
      <rect x="24" y="12" width="1" height="12" fill="#C8C0A8"/>
    </pattern>
    <!-- Halita rosa – camada de qualidade comercial -->
    <pattern id="pHalPink" x="0" y="0" width="48" height="24" patternUnits="userSpaceOnUse">
      <rect width="48" height="24" fill="#E8C8C0"/>
      <rect width="48" height="1" fill="#C8A098"/>
      <rect y="12" width="48" height="1" fill="#C8A098"/>
      <rect width="1" height="12" fill="#C8A098"/>
      <rect x="47" width="1" height="12" fill="#C8A098"/>
      <rect x="24" y="12" width="1" height="12" fill="#C8A098"/>
    </pattern>
    <!-- Argila intercalada -->
    <pattern id="pClay" x="0" y="0" width="64" height="16" patternUnits="userSpaceOnUse">
      <rect width="64" height="16" fill="#B09060"/>
      <rect width="64" height="1" fill="#907040"/>
      <rect y="8" width="64" height="1" fill="#907040"/>
      <rect width="1" height="8" fill="#907040"/>
      <rect x="63" width="1" height="8" fill="#907040"/>
    </pattern>
    <!-- Sub-solo sal compactado -->
    <pattern id="pSalSub" x="0" y="0" width="64" height="20" patternUnits="userSpaceOnUse">
      <rect width="64" height="20" fill="#D0C8B0"/>
      <rect width="64" height="1" fill="#A09880"/>
      <rect y="10" width="64" height="1" fill="#A09880"/>
      <rect width="1" height="10" fill="#A09880"/>
      <rect x="63" width="1" height="10" fill="#A09880"/>
      <rect x="32" y="10" width="1" height="10" fill="#A09880"/>
    </pattern>
  </defs>

  <!-- ===================== CÉU – branco cegante do Saara ===================== -->
  <!-- O céu de Taoudenni é branco-azulado, com refrações de calor -->
  <rect x="0" y="0" width="1456" height="839" fill="#E8F0F8"/>
  <rect x="0" y="0"   width="1456" height="60"  fill="#C8D8F0"/>
  <rect x="0" y="60"  width="1456" height="100" fill="#D8ECF8"/>
  <rect x="0" y="160" width="1456" height="100" fill="#E8F4FF"/>
  <rect x="0" y="260" width="1456" height="80"  fill="#F0F8FF"/>
  <rect x="0" y="340" width="1456" height="60"  fill="#F8FCFF"/>

  <!-- Sol de meio-dia – branco absoluto, quase sem cor -->
  <rect x="650" y="30" width="80" height="80" fill="#FFFFFF"/>
  <rect x="658" y="18" width="64" height="12" fill="#FFFFFF"/>
  <rect x="658" y="98" width="64" height="12" fill="#FFFFFF"/>
  <rect x="638" y="50" width="12" height="40" fill="#FFFFFF"/>
  <rect x="730" y="50" width="12" height="40" fill="#FFFFFF"/>
  <!-- halo de calor branco-amarelado -->
  <rect x="610" y="30" width="200" height="80" fill="#FFFFE0" opacity="0.4"/>
  <rect x="570" y="50" width="280" height="40" fill="#FFFFE0" opacity="0.2"/>
  <!-- névoa de calor no horizonte -->
  <rect x="0" y="395" width="1456" height="20" fill="#FFFFFF" opacity="0.5"/>
  <rect x="0" y="400" width="1456" height="12" fill="#F0F8FF" opacity="0.4"/>

  <!-- ===================== PAREDE FRONTAL DE SAL ESTRATIFICADO ===================== -->
  <!-- Esta é a vista principal: corte transversal da mina de sal -->
  <!-- Mostra os estratos horizontais como "páginas de um livro" -->

  <!-- Estrato superficial – poroso, bege-acinzentado (qualidade inferior) -->
  <rect x="0" y="400" width="1456" height="32" fill="#D0C8A8"/>
  <rect x="0" y="400" width="1456" height="3"  fill="#E0D8B8"/>
  <rect x="0" y="429" width="1456" height="3"  fill="#B0A888"/>

  <!-- Fissuras e fragmentações no estrato superficial -->
  <rect x="120" y="403" width="2"  height="28" fill="#A89870" opacity="0.7"/>
  <rect x="280" y="403" width="2"  height="22" fill="#A89870" opacity="0.6"/>
  <rect x="520" y="406" width="2"  height="20" fill="#A89870" opacity="0.7"/>
  <rect x="780" y="403" width="2"  height="28" fill="#A89870" opacity="0.6"/>
  <rect x="1040" y="406" width="2" height="20" fill="#A89870" opacity="0.7"/>
  <rect x="1300" y="403" width="2" height="28" fill="#A89870" opacity="0.6"/>

  <!-- Estrato 2 – argila avermelhada (linha fina intercalada) -->
  <rect x="0" y="432" width="1456" height="12" fill="url(#pClay)"/>
  <rect x="0" y="432" width="1456" height="2"  fill="#C09060"/>
  <rect x="0" y="442" width="1456" height="2"  fill="#806040"/>

  <!-- Estrato 3 – halita comercial branca translúcida (qualidade principal) -->
  <rect x="0" y="444" width="1456" height="48" fill="url(#pHalita)"/>
  <rect x="0" y="444" width="1456" height="3"  fill="#F0EEE8"/>
  <rect x="0" y="489" width="1456" height="3"  fill="#C0B8A0"/>
  <!-- Brilho de facetas cúbicas no estrato branco -->
  <rect x="0"    y="452" width="60"  height="8" fill="#FFFFFF" opacity="0.3"/>
  <rect x="200"  y="456" width="80"  height="6" fill="#FFFFFF" opacity="0.25"/>
  <rect x="440"  y="450" width="100" height="8" fill="#FFFFFF" opacity="0.3"/>
  <rect x="700"  y="454" width="80"  height="6" fill="#FFFFFF" opacity="0.25"/>
  <rect x="960"  y="452" width="100" height="8" fill="#FFFFFF" opacity="0.3"/>
  <rect x="1260" y="456" width="80"  height="6" fill="#FFFFFF" opacity="0.25"/>

  <!-- Estrato 4 – halita ROSA (cristais puros, camada profunda, mais valiosa) -->
  <rect x="0" y="492" width="1456" height="40" fill="url(#pHalPink)"/>
  <rect x="0" y="492" width="1456" height="3"  fill="#F0D8D0"/>
  <rect x="0" y="529" width="1456" height="3"  fill="#C0A098"/>
  <!-- Brilho rosado nas facetas -->
  <rect x="80"  y="500" width="60"  height="6" fill="#FFE8E0" opacity="0.4"/>
  <rect x="320" y="502" width="80"  height="4" fill="#FFE8E0" opacity="0.35"/>
  <rect x="600" y="500" width="80"  height="6" fill="#FFE8E0" opacity="0.4"/>
  <rect x="880" y="502" width="60"  height="4" fill="#FFE8E0" opacity="0.35"/>
  <rect x="1120" y="500" width="80" height="6" fill="#FFE8E0" opacity="0.4"/>
  <rect x="1360" y="502" width="60" height="4" fill="#FFE8E0" opacity="0.35"/>

  <!-- Estrato 5 – argila mais espessa (segundo intercalação) -->
  <rect x="0" y="532" width="1456" height="16" fill="url(#pClay)"/>
  <rect x="0" y="532" width="1456" height="2"  fill="#C09060"/>
  <rect x="0" y="546" width="1456" height="2"  fill="#806040"/>

  <!-- Estrato 6 – sal profundo, mais compactado e âmbar -->
  <rect x="0" y="548" width="1456" height="36" fill="url(#pSalSub)"/>
  <rect x="0" y="548" width="1456" height="3"  fill="#E0D8C0"/>
  <rect x="0" y="581" width="1456" height="3"  fill="#A09878"/>

  <!-- ===================== ZONA DE EXTRAÇÃO ATIVA ===================== -->
  <!-- Cortes horizontais já feitos (lajes removidas – buracos escuros) -->
  <!-- Zona de extração esquerda -->
  <rect x="60"  y="444" width="140" height="48" fill="#2A1E10" opacity="0.85"/>
  <rect x="60"  y="444" width="140" height="3"  fill="#3A2818" opacity="0.9"/>
  <!-- Interior da cavidade – fundo com reflexo de sal -->
  <rect x="62"  y="447" width="136" height="6" fill="#D0C8A0" opacity="0.3"/>
  <!-- Laje já extraída, apoiada na beirada -->
  <rect x="200" y="470" width="80"  height="18" fill="#E0D8C8"/>
  <rect x="200" y="470" width="80"  height="2"  fill="#F0EAD8"/>
  <rect x="200" y="486" width="80"  height="2"  fill="#C0B8A0"/>
  <!-- Marcas de corte (linhas do machado tuaregue) -->
  <rect x="220" y="472" width="2"  height="14" fill="#A09870" opacity="0.6"/>
  <rect x="240" y="472" width="2"  height="14" fill="#A09870" opacity="0.6"/>
  <rect x="260" y="472" width="2"  height="14" fill="#A09870" opacity="0.6"/>

  <!-- Zona de extração central -->
  <rect x="580" y="444" width="180" height="48" fill="#2A1E10" opacity="0.85"/>
  <rect x="580" y="444" width="180" height="3"  fill="#3A2818" opacity="0.9"/>
  <rect x="582" y="447" width="176" height="6"  fill="#D0C8A0" opacity="0.3"/>
  <!-- Lajes empilhadas ao lado -->
  <rect x="760" y="466" width="80"  height="18" fill="#E0D8C8"/>
  <rect x="760" y="466" width="80"  height="2"  fill="#F0EAD8"/>
  <rect x="760" y="484" width="80"  height="2"  fill="#C0B8A0"/>
  <rect x="760" y="450" width="80"  height="18" fill="#D8D0C0"/>
  <rect x="760" y="450" width="80"  height="2"  fill="#E8E0D0"/>
  <rect x="760" y="468" width="80"  height="2"  fill="#B8B0A0"/>
  <!-- Cordas amarrando as lajes -->
  <rect x="780" y="450" width="4"  height="36" fill="#C8A050" opacity="0.8"/>
  <rect x="820" y="450" width="4"  height="36" fill="#C8A050" opacity="0.8"/>

  <!-- Zona de extração direita -->
  <rect x="1200" y="492" width="160" height="40" fill="#2A1E10" opacity="0.85"/>
  <rect x="1200" y="492" width="160" height="3"  fill="#3A2818" opacity="0.9"/>
  <rect x="1202" y="495" width="156" height="5"  fill="#E0C8C0" opacity="0.3"/>
  <!-- Laje sendo extraída (parcialmente solta) -->
  <rect x="1200" y="492" width="80"  height="40" fill="#E8C8C0" opacity="0.6"/>
  <rect x="1200" y="492" width="80"  height="2"  fill="#F0D8D0"/>

  <!-- ===================== FERRAMENTAS NO CHÃO ===================== -->
  <!-- Machados de pedra tuaregues (sem cabo de metal) -->
  <!-- Machado 1 -->
  <rect x="400" y="556" width="40" height="12" fill="#6A5A38"/>
  <rect x="402" y="550" width="16" height="18" fill="#8A7848"/>
  <rect x="400" y="548" width="20" height="4"  fill="#A09060"/>
  <!-- Machado 2 -->
  <rect x="900" y="556" width="40" height="12" fill="#6A5A38"/>
  <rect x="902" y="550" width="16" height="18" fill="#8A7848"/>
  <rect x="900" y="548" width="20" height="4"  fill="#A09060"/>

  <!-- Cabaças de água (vitais no Saara) -->
  <rect x="540" y="556" width="20" height="24" fill="#8B6A20"/>
  <rect x="544" y="554" width="12" height="4"  fill="#9A7828"/>
  <rect x="548" y="550" width="4"  height="6"  fill="#5A3A10"/>
  <!-- Cabaça 2 -->
  <rect x="1120" y="558" width="18" height="22" fill="#8B6A20"/>
  <rect x="1124" y="556" width="10" height="4"  fill="#9A7828"/>
  <rect x="1127" y="552" width="4"  height="6"  fill="#5A3A10"/>

  <!-- Tecidos tuaregues (agal/turbante azul deixado no chão) -->
  <rect x="340" y="562" width="50" height="8"  fill="#1A4A80" opacity="0.8"/>
  <rect x="340" y="562" width="50" height="2"  fill="#2A5A90" opacity="0.9"/>

  <!-- Areia acumulada na base da parede de sal -->
  <rect x="0" y="584" width="1456" height="18" fill="#D0B068"/>
  <rect x="0" y="584" width="1456" height="3"  fill="#E0C078"/>
  <!-- Ondulações de areia (pixel art) -->
  <rect x="0"    y="590" width="120" height="4" fill="#C8A858" opacity="0.6"/>
  <rect x="200"  y="592" width="160" height="4" fill="#C8A858" opacity="0.6"/>
  <rect x="480"  y="590" width="120" height="4" fill="#C8A858" opacity="0.6"/>
  <rect x="720"  y="592" width="160" height="4" fill="#C8A858" opacity="0.6"/>
  <rect x="1000" y="590" width="120" height="4" fill="#C8A858" opacity="0.6"/>
  <rect x="1240" y="592" width="120" height="4" fill="#C8A858" opacity="0.6"/>

  <!-- ===================== CAMADAS PROFUNDAS DE SAL ===================== -->
  <rect x="0" y="602" width="1456" height="40"  fill="#C0B8A0"/>
  <rect x="0" y="602" width="1456" height="3"   fill="#D0C8B0"/>
  <rect x="0" y="642" width="1456" height="50"  fill="#B0A890"/>
  <rect x="0" y="692" width="1456" height="147" fill="#483820"/>
</svg>
