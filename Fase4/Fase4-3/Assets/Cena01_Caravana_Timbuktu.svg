<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg
   width="1456"
   viewBox="0 0 1456 839"
   height="839"
   role="img"
   version="1.1"
   xmlns="http://www.w3.org/2000/svg">
  <title>Fase 4.3 Cena 01 – Caravana se aproximando de Timbuktu</title>
  <desc>Pixel art 2D – Sahel ao entardecer, minaretes ao fundo, caravana de sal chegando pelo norte. Fundo sem personagens.</desc>

  <!-- ===================== DEFS – padrões de chão ===================== -->
  <defs>
    <!-- Areia do Saara: grão fino dourado-ocre -->
    <pattern id="pSand" x="0" y="0" width="64" height="20" patternUnits="userSpaceOnUse">
      <rect width="64" height="20" fill="#C8904A"/>
      <rect width="64" height="1" fill="#B07838"/>
      <rect y="10" width="64" height="1" fill="#B07838"/>
      <rect width="1" height="10" fill="#B07838"/>
      <rect x="63" width="1" height="10" fill="#B07838"/>
      <rect x="32" y="10" width="1" height="10" fill="#B07838"/>
    </pattern>
    <!-- Sahel: terra ocre-avermelhada -->
    <pattern id="pSahel" x="0" y="0" width="64" height="20" patternUnits="userSpaceOnUse">
      <rect width="64" height="20" fill="#A06030"/>
      <rect width="64" height="1" fill="#804820"/>
      <rect y="10" width="64" height="1" fill="#804820"/>
      <rect width="1" height="10" fill="#804820"/>
      <rect x="63" width="1" height="10" fill="#804820"/>
      <rect x="32" y="10" width="1" height="10" fill="#804820"/>
    </pattern>
    <!-- Sub-solo escuro -->
    <pattern id="pSub" x="0" y="0" width="64" height="20" patternUnits="userSpaceOnUse">
      <rect width="64" height="20" fill="#3A2010"/>
      <rect width="64" height="1" fill="#281408"/>
      <rect y="10" width="64" height="1" fill="#281408"/>
      <rect width="1" height="10" fill="#281408"/>
      <rect x="63" width="1" height="10" fill="#281408"/>
      <rect x="32" y="10" width="1" height="10" fill="#281408"/>
    </pattern>
  </defs>

  <!-- ===================== CÉU – tarde dourada do Sahel ===================== -->
  <!-- Base: azul profundo de altitude -->
  <rect x="0" y="0" width="1456" height="839" fill="#3A6A9A"/>
  <!-- Gradiente empilhado pixel art: de azul-cobalto no topo a laranja-mel no horizonte -->
  <rect x="0" y="0"   width="1456" height="80"  fill="#2A5A8C"/>
  <rect x="0" y="80"  width="1456" height="80"  fill="#3A78B0"/>
  <rect x="0" y="160" width="1456" height="80"  fill="#5090C0"/>
  <rect x="0" y="240" width="1456" height="70"  fill="#6AACCC"/>
  <rect x="0" y="310" width="1456" height="60"  fill="#98C8CC"/>
  <rect x="0" y="370" width="1456" height="50"  fill="#D4B870"/>
  <rect x="0" y="420" width="1456" height="50"  fill="#E8A848"/>
  <rect x="0" y="470" width="1456" height="50"  fill="#D08038"/>
  <rect x="0" y="520" width="1456" height="50"  fill="#B86028"/>

  <!-- Sol baixo no horizonte – laranja brilhante -->
  <rect x="1180" y="435" width="64" height="64" fill="#FFD040"/>
  <rect x="1188" y="427" width="48" height="8"  fill="#FFD040"/>
  <rect x="1188" y="499" width="48" height="8"  fill="#FFD040"/>
  <rect x="1172" y="451" width="8"  height="32" fill="#FFD040"/>
  <rect x="1244" y="451" width="8"  height="32" fill="#FFD040"/>
  <!-- halo do sol -->
  <rect x="1172" y="451" width="108" height="48" fill="#FFE870" opacity="0.25"/>
  <rect x="1156" y="459" width="144" height="32" fill="#FFF0A0" opacity="0.15"/>
  <!-- reflexo no chão -->
  <rect x="0" y="518" width="1456" height="6" fill="#E8901C" opacity="0.4"/>

  <!-- Nuvens de alto deserto – finas, horizontais, avermelhadas -->
  <rect x="60"  y="55"  width="220" height="12" fill="#F0C890" opacity="0.7"/>
  <rect x="80"  y="63"  width="180" height="8"  fill="#E8B878" opacity="0.5"/>
  <rect x="360" y="38"  width="160" height="10" fill="#F0C890" opacity="0.65"/>
  <rect x="370" y="46"  width="140" height="6"  fill="#E8B878" opacity="0.5"/>
  <rect x="620" y="70"  width="200" height="10" fill="#F0D090" opacity="0.6"/>
  <rect x="900" y="48"  width="180" height="12" fill="#F0C890" opacity="0.65"/>
  <rect x="1080" y="80" width="140" height="8"  fill="#E8B878" opacity="0.5"/>

  <!-- ===================== DUNAS AO FUNDO (horizonte norte) ===================== -->
  <!-- Silhueta de dunas: série de polígonos suaves empilhados em perspectiva -->
  <!-- Duna fundo distante (mais clara) -->
  <polygon points="0,570 200,490 420,530 640,480 860,515 1050,475 1260,510 1456,488 1456,590 0,590" fill="#C8905A" opacity="0.55"/>
  <!-- Duna média -->
  <polygon points="0,590 180,540 380,570 560,538 780,562 1000,535 1200,558 1350,542 1456,550 1456,610 0,610" fill="#B8783A"/>
  <!-- Duna próxima -->
  <polygon points="0,610 0,648 250,618 420,648 600,622 820,650 1050,624 1280,648 1456,626 1456,610" fill="#A86830"/>

  <!-- ===================== TIMBUKTU AO FUNDO ===================== -->
  <!-- Muralha da cidade – terra crua, longa e baixa -->
  <rect x="280"  y="502" width="900" height="46" fill="#8B5A28"/>
  <rect x="280"  y="502" width="900" height="4"  fill="#A87040"/>
  <!-- Ameias topo muralha -->
  <rect x="292"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="332"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="372"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="412"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="452"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="492"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="552"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="612"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="672"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="740"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="800"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="860"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="920"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="980"  y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="1040" y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="1100" y="494" width="20" height="8" fill="#8B5A28"/>
  <rect x="1140" y="494" width="20" height="8" fill="#8B5A28"/>

  <!-- Casas de terra (construções baixas de adobe atrás da muralha) -->
  <!-- Bloco esquerdo -->
  <rect x="300" y="468" width="90" height="36" fill="#7A4E24"/>
  <rect x="300" y="468" width="90" height="3"  fill="#9A6E38"/>
  <rect x="318" y="476" width="14" height="14" fill="#3A2010" opacity="0.7"/>
  <rect x="348" y="476" width="14" height="14" fill="#3A2010" opacity="0.7"/>
  <!-- Bloco centro-esquerdo -->
  <rect x="430" y="458" width="120" height="46" fill="#7A4E24"/>
  <rect x="430" y="458" width="120" height="3"  fill="#9A6E38"/>
  <rect x="448" y="468" width="16" height="16" fill="#3A2010" opacity="0.7"/>
  <rect x="490" y="468" width="16" height="16" fill="#3A2010" opacity="0.7"/>
  <rect x="524" y="468" width="16" height="16" fill="#3A2010" opacity="0.7"/>
  <!-- Bloco centro -->
  <rect x="600" y="462" width="100" height="42" fill="#7A4E24"/>
  <rect x="600" y="462" width="100" height="3"  fill="#9A6E38"/>
  <rect x="618" y="472" width="14" height="14" fill="#3A2010" opacity="0.7"/>
  <rect x="666" y="472" width="14" height="14" fill="#3A2010" opacity="0.7"/>
  <!-- Bloco centro-direito -->
  <rect x="760" y="456" width="130" height="48" fill="#7A4E24"/>
  <rect x="760" y="456" width="130" height="3"  fill="#9A6E38"/>
  <rect x="776" y="466" width="16" height="16" fill="#3A2010" opacity="0.7"/>
  <rect x="820" y="466" width="16" height="16" fill="#3A2010" opacity="0.7"/>
  <rect x="860" y="466" width="16" height="16" fill="#3A2010" opacity="0.7"/>
  <!-- Bloco direito -->
  <rect x="950" y="470" width="90" height="34" fill="#7A4E24"/>
  <rect x="950" y="470" width="90" height="3"  fill="#9A6E38"/>
  <rect x="968" y="480" width="14" height="14" fill="#3A2010" opacity="0.7"/>
  <rect x="1006" y="480" width="14" height="14" fill="#3A2010" opacity="0.7"/>

  <!-- === MINARETE 1 – Djingareyber (centro-esquerdo, maior) === -->
  <!-- Base larga da mesquita -->
  <rect x="440" y="390" width="120" height="114" fill="#9A6A30"/>
  <rect x="440" y="390" width="120" height="4"   fill="#C08A48"/>
  <!-- Janelas da mesquita -->
  <rect x="456" y="406" width="18" height="22" fill="#3A2010" opacity="0.8"/>
  <rect x="492" y="406" width="18" height="22" fill="#3A2010" opacity="0.8"/>
  <rect x="524" y="406" width="18" height="22" fill="#3A2010" opacity="0.8"/>
  <!-- Cúpula e pico do minarete Djingareyber -->
  <rect x="478" y="310" width="44" height="80" fill="#B87A38"/>
  <rect x="478" y="310" width="44" height="4"  fill="#D09A58"/>
  <rect x="482" y="298" width="36" height="14" fill="#C88840"/>
  <rect x="488" y="288" width="24" height="12" fill="#C88840"/>
  <rect x="494" y="278" width="12" height="12" fill="#C88840"/>
  <rect x="497" y="266" width="6"  height="14" fill="#D09A58"/>
  <!-- Ramos de tomate (spikes decorativos típicos de Djingareyber) -->
  <rect x="456" y="354" width="6"  height="4" fill="#8B5A20"/>
  <rect x="476" y="346" width="6"  height="4" fill="#8B5A20"/>
  <rect x="516" y="346" width="6"  height="4" fill="#8B5A20"/>
  <rect x="536" y="354" width="6"  height="4" fill="#8B5A20"/>
  <rect x="466" y="360" width="6"  height="4" fill="#8B5A20"/>
  <rect x="526" y="360" width="6"  height="4" fill="#8B5A20"/>

  <!-- === MINARETE 2 – Sankoré (centro, mais à direita) === -->
  <rect x="680" y="402" width="100" height="102" fill="#9A6A30"/>
  <rect x="680" y="402" width="100" height="4"   fill="#C08A48"/>
  <rect x="696" y="416" width="16" height="20" fill="#3A2010" opacity="0.8"/>
  <rect x="726" y="416" width="16" height="20" fill="#3A2010" opacity="0.8"/>
  <rect x="756" y="416" width="16" height="20" fill="#3A2010" opacity="0.8"/>
  <!-- Torre Sankoré (piramidal) -->
  <rect x="712" y="328" width="36" height="74" fill="#B07030"/>
  <rect x="712" y="328" width="36" height="4"  fill="#D09050"/>
  <rect x="716" y="316" width="28" height="14" fill="#B87838"/>
  <rect x="720" y="304" width="20" height="14" fill="#B87838"/>
  <rect x="724" y="292" width="12" height="14" fill="#B87838"/>
  <rect x="727" y="280" width="6"  height="14" fill="#C08040"/>
  <rect x="729" y="268" width="2"  height="14" fill="#D0AA60"/>
  <!-- Spikes Sankoré -->
  <rect x="688" y="366" width="6"  height="4" fill="#7A4A18"/>
  <rect x="706" y="358" width="6"  height="4" fill="#7A4A18"/>
  <rect x="744" y="358" width="6"  height="4" fill="#7A4A18"/>
  <rect x="762" y="366" width="6"  height="4" fill="#7A4A18"/>

  <!-- === MINARETE 3 – Sidi Yahia (direito, mais baixo) === -->
  <rect x="1020" y="436" width="80" height="68" fill="#9A6A30"/>
  <rect x="1020" y="436" width="80" height="4"  fill="#C08A48"/>
  <rect x="1034" y="450" width="14" height="18" fill="#3A2010" opacity="0.8"/>
  <rect x="1060" y="450" width="14" height="18" fill="#3A2010" opacity="0.8"/>
  <rect x="1086" y="450" width="14" height="18" fill="#3A2010" opacity="0.8"/>
  <!-- Torre Sidi Yahia -->
  <rect x="1046" y="368" width="28" height="68" fill="#A86828"/>
  <rect x="1046" y="368" width="28" height="4"  fill="#C88840"/>
  <rect x="1050" y="356" width="20" height="14" fill="#B07030"/>
  <rect x="1054" y="344" width="12" height="14" fill="#B07030"/>
  <rect x="1057" y="332" width="6"  height="14" fill="#B87838"/>
  <rect x="1059" y="320" width="2"  height="14" fill="#D0AA60"/>
  <!-- Spikes Sidi Yahia -->
  <rect x="1026" y="396" width="4"  height="4" fill="#7A4A18"/>
  <rect x="1038" y="390" width="4"  height="4" fill="#7A4A18"/>
  <rect x="1058" y="388" width="4"  height="4" fill="#7A4A18"/>
  <rect x="1074" y="390" width="4"  height="4" fill="#7A4A18"/>
  <rect x="1088" y="396" width="4"  height="4" fill="#7A4A18"/>

  <!-- Palmeiras à direita da cidade (borda do Níger) -->
  <!-- Palmeira 1 -->
  <rect x="1160" y="468" width="8" height="80" fill="#5A3A10"/>
  <rect x="1148" y="460" width="32" height="12" fill="#2A6018" opacity="0.9"/>
  <rect x="1144" y="452" width="40" height="10" fill="#347820" opacity="0.85"/>
  <rect x="1152" y="444" width="24" height="10" fill="#2A6018" opacity="0.9"/>
  <rect x="1158" y="438" width="12" height="8"  fill="#347820"/>
  <!-- Palmeira 2 -->
  <rect x="1200" y="476" width="8" height="72" fill="#5A3A10"/>
  <rect x="1188" y="466" width="32" height="12" fill="#2A6018" opacity="0.9"/>
  <rect x="1184" y="458" width="40" height="10" fill="#347820" opacity="0.85"/>
  <rect x="1192" y="450" width="24" height="10" fill="#2A6018"/>
  <rect x="1198" y="442" width="12" height="10" fill="#347820"/>
  <!-- Palmeira 3 menor -->
  <rect x="1238" y="486" width="6" height="62" fill="#4A3008"/>
  <rect x="1228" y="477" width="28" height="10" fill="#2A6018" opacity="0.85"/>
  <rect x="1224" y="469" width="36" height="10" fill="#347820" opacity="0.8"/>
  <rect x="1232" y="461" width="20" height="8"  fill="#2A6018"/>
  <!-- Palmeira 4 esquerda da cidade -->
  <rect x="288" y="478" width="6" height="70" fill="#5A3A10"/>
  <rect x="276" y="469" width="30" height="10" fill="#2A6018" opacity="0.85"/>
  <rect x="272" y="461" width="38" height="10" fill="#347820" opacity="0.8"/>
  <rect x="280" y="453" width="22" height="8"  fill="#2A6018"/>
  <rect x="286" y="447" width="10" height="8"  fill="#347820"/>

  <!-- Rio Níger – brilho dourado ao longe (faixa horizontal, extremo direito) -->
  <rect x="1300" y="510" width="156" height="18" fill="#C8901C" opacity="0.7"/>
  <rect x="1300" y="510" width="156" height="4"  fill="#E8B840" opacity="0.6"/>
  <rect x="1320" y="514" width="60"  height="2"  fill="#FFE070" opacity="0.4"/>

  <!-- ===================== TERRENO DO SAHEL ===================== -->
  <!-- Plataforma superior: areia e caravana -->
  <rect x="0" y="570" width="1456" height="28" fill="url(#pSand)"/>
  <rect x="0" y="570" width="1456" height="4"  fill="#D0A860"/>
  <!-- Estrada de caravana (via natural compactada mais escura) -->
  <rect x="0" y="574" width="1456" height="18" fill="#A06830" opacity="0.5"/>

  <!-- Pegadas de camelos na areia (faixas escuras) -->
  <rect x="100" y="577" width="8"  height="4" fill="#8B5820" opacity="0.6"/>
  <rect x="160" y="579" width="8"  height="4" fill="#8B5820" opacity="0.6"/>
  <rect x="220" y="577" width="8"  height="4" fill="#8B5820" opacity="0.6"/>
  <rect x="300" y="578" width="8"  height="4" fill="#8B5820" opacity="0.6"/>
  <rect x="380" y="577" width="8"  height="4" fill="#8B5820" opacity="0.6"/>
  <rect x="460" y="579" width="8"  height="4" fill="#8B5820" opacity="0.6"/>
  <rect x="540" y="577" width="8"  height="4" fill="#8B5820" opacity="0.6"/>
  <rect x="620" y="578" width="8"  height="4" fill="#8B5820" opacity="0.6"/>

  <!-- Fardos de sal caídos na beira do caminho -->
  <rect x="80"  y="568" width="30" height="14" fill="#E0E0D0"/>
  <rect x="80"  y="568" width="30" height="3"  fill="#F0F0E0"/>
  <rect x="82"  y="571" width="26" height="1"  fill="#C0C0B0"/>
  <!-- Fardo 2 -->
  <rect x="330" y="566" width="28" height="12" fill="#D8D8C8"/>
  <rect x="330" y="566" width="28" height="3"  fill="#E8E8D8"/>

  <!-- Arbusto seco do Sahel (acácia spinosa, sem folhas) -->
  <!-- Arbusto 1 esquerda -->
  <rect x="20"  y="554" width="4"  height="20" fill="#6A4818"/>
  <rect x="10"  y="554" width="24" height="4"  fill="#6A4818"/>
  <rect x="14"  y="546" width="16" height="10" fill="#5A3810"/>
  <rect x="18"  y="540" width="8"  height="8"  fill="#5A3810"/>
  <!-- Arbusto 2 -->
  <rect x="190" y="558" width="4"  height="14" fill="#6A4818"/>
  <rect x="182" y="558" width="20" height="4"  fill="#6A4818"/>
  <rect x="185" y="550" width="14" height="8"  fill="#5A3810"/>
  <!-- Arbusto 3 direita -->
  <rect x="1380" y="552" width="4"  height="22" fill="#6A4818"/>
  <rect x="1368" y="554" width="28" height="4"  fill="#6A4818"/>
  <rect x="1372" y="546" width="20" height="10" fill="#5A3810"/>

  <!-- ===================== CAMADAS DE SOLO ===================== -->
  <rect x="0" y="598" width="1456" height="26"  fill="url(#pSahel)"/>
  <rect x="0" y="598" width="1456" height="4"   fill="#904820"/>
  <rect x="0" y="624" width="1456" height="70"  fill="url(#pSub)"/>
  <rect x="0" y="694" width="1456" height="145" fill="#200C06"/>
</svg>
