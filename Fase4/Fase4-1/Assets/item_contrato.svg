<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 80 80" shape-rendering="crispEdges" width="160" height="160" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs/>
  <!-- Card frame -->
  <rect x="0" y="0" width="80" height="80" fill="#2C1810"/>
  <rect x="2" y="2" width="76" height="76" fill="#3D2214"/>
  <rect x="3" y="3" width="74" height="74" fill="#1a0f08"/>
  <rect x="3" y="3" width="74" height="1" fill="#6B3A1F"/>
  <rect x="3" y="3" width="1" height="74" fill="#6B3A1F"/>
  <rect x="3" y="76" width="74" height="1" fill="#0d0804"/>
  <rect x="76" y="3" width="1" height="74" fill="#0d0804"/>

  <!-- Background: dark wood desk surface -->
  <rect x="4" y="4" width="72" height="72" fill="#3A2410"/>
  <!-- Wood grain -->
  <rect x="4" y="10" width="72" height="2"  fill="#402A14" opacity="0.7"/>
  <rect x="4" y="24" width="72" height="2"  fill="#301E0C" opacity="0.6"/>
  <rect x="4" y="40" width="72" height="2"  fill="#402A14" opacity="0.7"/>
  <rect x="4" y="56" width="72" height="2"  fill="#301E0C" opacity="0.6"/>
  <rect x="4" y="68" width="72" height="2"  fill="#402A14" opacity="0.5"/>

  <!-- === DOCUMENT / CONTRACT === -->
  <!-- Paper shadow -->
  <rect x="14" y="12" width="54" height="60" fill="#1A1008"/>
  <!-- Paper body (aged/cream, old colonial document) -->
  <rect x="12" y="10" width="54" height="60" fill="#E8D8A8"/>
  <rect x="13" y="11" width="52" height="58" fill="#EEE0B4"/>
  <!-- Paper edge highlight -->
  <rect x="12" y="10" width="2"  height="60" fill="#F4EAC4"/>
  <rect x="12" y="10" width="54" height="2"  fill="#F4EAC4"/>
  <!-- Paper aged edges (yellowing) -->
  <rect x="62" y="10" width="4"  height="60" fill="#D8C898"/>
  <rect x="12" y="66" width="54" height="4"  fill="#D8C898"/>

  <!-- Crown / colonial seal top center -->
  <rect x="34" y="13" width="10" height="6"  fill="#C8A020"/><!-- crown base -->
  <rect x="32" y="12" width="14" height="3"  fill="#D4B030"/><!-- crown band -->
  <rect x="34" y="10" width="2"  height="4"  fill="#C8A020"/><!-- left prong -->
  <rect x="38" y="9"  width="2"  height="5"  fill="#D4B030"/><!-- center prong (tallest) -->
  <rect x="42" y="10" width="2"  height="4"  fill="#C8A020"/><!-- right prong -->
  <rect x="35" y="10" width="1"  height="1"  fill="#E0C040"/><!-- gem left -->
  <rect x="39" y="8"  width="1"  height="1"  fill="#E0C040"/><!-- gem center -->
  <rect x="43" y="10" width="1"  height="1"  fill="#E0C040"/><!-- gem right -->

  <!-- Document title text lines (pixel text blocks) -->
  <!-- Title bar -->
  <rect x="16" y="21" width="46" height="4"  fill="#8A6020"/><!-- title underline -->
  <rect x="18" y="21" width="42" height="3"  fill="#A07828"/>
  <!-- Title "text" pixel blocks -->
  <rect x="20" y="22" width="6"  height="2"  fill="#3A2010"/>
  <rect x="28" y="22" width="8"  height="2"  fill="#3A2010"/>
  <rect x="38" y="22" width="4"  height="2"  fill="#3A2010"/>
  <rect x="44" y="22" width="10" height="2"  fill="#3A2010"/>

  <!-- Body text lines (simulated text, thin pixel rows) -->
  <rect x="16" y="28" width="44" height="2"  fill="#4A3818"/>
  <rect x="16" y="32" width="38" height="2"  fill="#4A3818"/>
  <rect x="16" y="36" width="44" height="2"  fill="#4A3818"/>
  <rect x="16" y="40" width="30" height="2"  fill="#4A3818"/>
  <rect x="16" y="44" width="44" height="2"  fill="#4A3818"/>
  <rect x="16" y="48" width="42" height="2"  fill="#4A3818"/>

  <!-- Divider line -->
  <rect x="16" y="52" width="44" height="1"  fill="#8A6020"/>

  <!-- Signature lines (bottom left: worker, bottom right: company) -->
  <!-- Left signature area -->
  <rect x="16" y="57" width="18" height="1"  fill="#C89040"/><!-- signature line -->
  <!-- Signature scrawl (X-shaped pixel mark) -->
  <rect x="16" y="54" width="2"  height="2"  fill="#1A1008"/>
  <rect x="20" y="54" width="2"  height="2"  fill="#1A1008"/>
  <rect x="18" y="56" width="2"  height="2"  fill="#1A1008"/>
  <rect x="18" y="53" width="2"  height="1"  fill="#1A1008" opacity="0.8"/>
  <!-- "Worker" label dots -->
  <rect x="16" y="59" width="4"  height="1"  fill="#6A4818"/>
  <rect x="22" y="59" width="6"  height="1"  fill="#6A4818"/>

  <!-- Right signature area (company seal/stamp) -->
  <rect x="44" y="57" width="14" height="1"  fill="#C89040"/><!-- signature line -->
  <!-- Official red WAX SEAL (round stamp) -->
  <rect x="48" y="50" width="10" height="10" fill="#C82020"/><!-- seal base -->
  <rect x="46" y="52" width="14" height="6"  fill="#C82020"/>
  <rect x="50" y="48" width="6"  height="2"  fill="#C82020"/>
  <rect x="50" y="60" width="6"  height="2"  fill="#C82020"/>
  <!-- Seal center (diamond motif) -->
  <rect x="50" y="52" width="6"  height="6"  fill="#D83030"/>
  <rect x="52" y="50" width="2"  height="2"  fill="#D83030"/>
  <rect x="52" y="58" width="2"  height="2"  fill="#D83030"/>
  <!-- Diamond icon in seal -->
  <rect x="52" y="53" width="2"  height="4"  fill="#E84040"/>
  <rect x="51" y="54" width="4"  height="2"  fill="#E84040"/>
  <rect x="52" y="52" width="2"  height="1"  fill="#F09090"/><!-- bright spot -->
  <!-- Seal edge emboss dots -->
  <rect x="48" y="50" width="2"  height="2"  fill="#B81818"/>
  <rect x="56" y="50" width="2"  height="2"  fill="#B81818"/>
  <rect x="48" y="58" width="2"  height="2"  fill="#B81818"/>
  <rect x="56" y="58" width="2"  height="2"  fill="#B81818"/>

  <!-- QUILL PEN (leaning against/on document) -->
  <!-- Feather vane -->
  <rect x="58" y="14" width="6"  height="30" fill="#F0E8D0"/>
  <rect x="56" y="16" width="6"  height="26" fill="#F8F0DC"/>
  <rect x="54" y="18" width="4"  height="22" fill="#F0E8D0"/>
  <rect x="52" y="20" width="4"  height="18" fill="#E8E0C8"/>
  <!-- Feather barb detail -->
  <rect x="58" y="18" width="6"  height="1"  fill="#E0D8C0"/>
  <rect x="58" y="22" width="6"  height="1"  fill="#E0D8C0"/>
  <rect x="56" y="26" width="6"  height="1"  fill="#E0D8C0"/>
  <rect x="56" y="30" width="6"  height="1"  fill="#E0D8C0"/>
  <rect x="54" y="34" width="6"  height="1"  fill="#E0D8C0"/>
  <!-- Quill shaft (rachis) -->
  <rect x="60" y="14" width="2"  height="34" fill="#C8B888"/>
  <rect x="60" y="14" width="1"  height="34" fill="#D8C898"/>
  <!-- Nib (metal tip) -->
  <rect x="60" y="46" width="2"  height="6"  fill="#606050"/>
  <rect x="60" y="50" width="2"  height="4"  fill="#808070"/>
  <rect x="61" y="51" width="1"  height="2"  fill="#A0A090"/><!-- shine -->
  <!-- Ink dot at nib tip -->
  <rect x="60" y="52" width="2"  height="2"  fill="#1A1A40"/>

  <!-- Corner bolts -->
  <rect x="4"  y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="4"  y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="5"  y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="5"  y="74" width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="74" width="1" height="1" fill="#FFD080"/>
</svg>
