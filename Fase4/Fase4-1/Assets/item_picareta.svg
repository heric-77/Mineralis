<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 80 80" shape-rendering="crispEdges" width="160" height="160" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs/>
  <!-- Card frame -->
  <rect x="0" y="0" width="80" height="80" fill="#2C1810"/>
  <rect x="2" y="2" width="76" height="76" fill="#3D2214"/>
  <rect x="3" y="3" width="74" height="74" fill="#1a0f08"/>
  <rect x="3" y="3" width="74" height="1" fill="#6B3A1F"/>
  <rect x="3" y="3" width="1" height="74" fill="#6B3A1F"/>
  <rect x="3" y="76" width="74" height="1" fill="#0d0804"/>
  <rect x="76" y="3" width="1" height="74" fill="#0d0804"/>

  <!-- Background: kimberlite blue-grey rock face -->
  <rect x="4" y="4" width="72" height="72" fill="#2E3450"/>
  <!-- Rock texture layers (kimberlite strata) -->
  <rect x="4" y="4"  width="72" height="10" fill="#343A58"/>
  <rect x="4" y="18" width="72" height="8"  fill="#2A3048"/>
  <rect x="4" y="32" width="72" height="10" fill="#323858"/>
  <rect x="4" y="48" width="72" height="8"  fill="#282E46"/>
  <rect x="4" y="60" width="72" height="16" fill="#2E3450"/>
  <!-- Rock crack lines -->
  <rect x="20" y="4"  width="2"  height="30" fill="#202840" opacity="0.7"/>
  <rect x="50" y="20" width="2"  height="40" fill="#202840" opacity="0.6"/>
  <rect x="34" y="50" width="2"  height="26" fill="#202840" opacity="0.7"/>
  <!-- Diamond flecks in kimberlite -->
  <rect x="14" y="10" width="2" height="2" fill="#C0DCFF"/>
  <rect x="15" y="9"  width="1" height="1" fill="#FFFFFF"/>
  <rect x="62" y="20" width="2" height="2" fill="#C8E8FF"/>
  <rect x="63" y="19" width="1" height="1" fill="#FFFFFF"/>
  <rect x="28" y="55" width="2" height="2" fill="#C0DCFF"/>
  <rect x="29" y="54" width="1" height="1" fill="#FFFFFF"/>
  <rect x="56" y="62" width="2" height="2" fill="#C8E8FF"/>
  <rect x="57" y="61" width="1" height="1" fill="#FFFFFF"/>
  <rect x="44" y="36" width="2" height="2" fill="#D0EEFF"/>
  <rect x="45" y="35" width="1" height="1" fill="#FFFFFF"/>

  <!-- === PICKAXE (Picareta de Kimberlito) === -->
  <!-- Handle (hardwood, diagonal) -->
  <!-- Main shaft: diagonal from bottom-left to upper-right -->
  <rect x="8"  y="60" width="6" height="6"  fill="#7A5228"/>
  <rect x="12" y="56" width="6" height="6"  fill="#7A5228"/>
  <rect x="16" y="52" width="6" height="6"  fill="#7A5228"/>
  <rect x="20" y="48" width="6" height="6"  fill="#8A6030"/>
  <rect x="24" y="44" width="6" height="6"  fill="#8A6030"/>
  <rect x="28" y="40" width="6" height="6"  fill="#8A6030"/>
  <rect x="32" y="36" width="6" height="6"  fill="#9A6A38"/>
  <rect x="36" y="32" width="6" height="6"  fill="#9A6A38"/>
  <!-- Handle highlight stripe -->
  <rect x="9"  y="61" width="2" height="4"  fill="#9A7048"/>
  <rect x="13" y="57" width="2" height="4"  fill="#9A7048"/>
  <rect x="17" y="53" width="2" height="4"  fill="#9A7048"/>
  <rect x="21" y="49" width="2" height="4"  fill="#AE8050"/>
  <rect x="25" y="45" width="2" height="4"  fill="#AE8050"/>
  <rect x="29" y="41" width="2" height="4"  fill="#AE8050"/>
  <rect x="33" y="37" width="2" height="4"  fill="#BF9060"/>
  <rect x="37" y="33" width="2" height="4"  fill="#BF9060"/>
  <!-- Wood grain marks -->
  <rect x="10" y="62" width="4" height="1"  fill="#6A4820" opacity="0.6"/>
  <rect x="22" y="50" width="4" height="1"  fill="#6A4820" opacity="0.6"/>
  <rect x="30" y="42" width="4" height="1"  fill="#6A4820" opacity="0.6"/>

  <!-- Pickaxe HEAD (iron/steel, at upper-right, horizontal) -->
  <!-- Collar / socket where head meets handle -->
  <rect x="38" y="28" width="10" height="10" fill="#484840"/>
  <rect x="39" y="29" width="8"  height="8"  fill="#545448"/>
  <rect x="40" y="30" width="2"  height="4"  fill="#686860"/><!-- highlight -->

  <!-- LEFT SPIKE (curved, digging point) -->
  <rect x="18" y="26" width="22" height="6"  fill="#686858"/>
  <rect x="20" y="24" width="18" height="4"  fill="#787868"/>
  <rect x="22" y="22" width="14" height="4"  fill="#888878"/>
  <rect x="24" y="20" width="8"  height="4"  fill="#787868"/>
  <rect x="20" y="28" width="6"  height="4"  fill="#585848"/><!-- underside shadow -->
  <rect x="18" y="29" width="4"  height="3"  fill="#484838"/>
  <!-- Left tip point -->
  <rect x="12" y="26" width="8"  height="4"  fill="#909080"/>
  <rect x="8"  y="27" width="6"  height="2"  fill="#A0A090"/>
  <rect x="6"  y="27" width="4"  height="2"  fill="#B0B0A0"/>
  <rect x="4"  y="28" width="4"  height="1"  fill="#C0C0B0"/>
  <!-- Left tip highlight (sharp) -->
  <rect x="12" y="26" width="6"  height="2"  fill="#D0D0C0"/>
  <rect x="8"  y="27" width="4"  height="1"  fill="#E0E0D0"/>

  <!-- RIGHT SPIKE (flat pick side) -->
  <rect x="46" y="26" width="22" height="6"  fill="#686858"/>
  <rect x="50" y="24" width="18" height="4"  fill="#787868"/>
  <rect x="54" y="22" width="14" height="4"  fill="#888878"/>
  <rect x="56" y="20" width="10" height="4"  fill="#787868"/>
  <rect x="60" y="18" width="6"  height="4"  fill="#888878"/>
  <!-- Right tip (flat adze/chisel blade) -->
  <rect x="64" y="22" width="10" height="8"  fill="#909080"/>
  <rect x="66" y="21" width="8"  height="2"  fill="#A8A898"/><!-- top bevel -->
  <rect x="66" y="29" width="8"  height="2"  fill="#585848"/><!-- bottom shadow -->
  <rect x="72" y="22" width="4"  height="8"  fill="#B0B0A0"/><!-- face -->
  <rect x="72" y="22" width="4"  height="2"  fill="#D0D0C0"/><!-- cutting edge bright -->

  <!-- Metal texture / forge marks on head -->
  <rect x="40" y="26" width="8"  height="1"  fill="#808070" opacity="0.6"/>
  <rect x="42" y="30" width="4"  height="1"  fill="#606050" opacity="0.7"/>
  <!-- Kimberlite dust on tip (blue-grey) -->
  <rect x="4"  y="28" width="4"  height="2"  fill="#3A4060" opacity="0.6"/>
  <rect x="72" y="24" width="4"  height="2"  fill="#3A4060" opacity="0.5"/>

  <!-- Small kimberlite chunk at base (just dislodged) -->
  <rect x="10" y="62" width="10" height="8"  fill="#303850"/>
  <rect x="12" y="60" width="8"  height="4"  fill="#383E58"/>
  <!-- Diamond glint in chunk -->
  <rect x="14" y="64" width="2"  height="2"  fill="#B0CCEE"/>
  <rect x="15" y="63" width="1"  height="1"  fill="#FFFFFF"/>

  <!-- Corner bolts -->
  <rect x="4"  y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="4"  y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="5"  y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="5"  y="74" width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="74" width="1" height="1" fill="#FFD080"/>
</svg>
