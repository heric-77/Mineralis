<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 80 80" shape-rendering="crispEdges" width="160" height="160" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs/>
  <!-- Card frame -->
  <rect x="0" y="0" width="80" height="80" fill="#2C1810"/>
  <rect x="2" y="2" width="76" height="76" fill="#3D2214"/>
  <rect x="3" y="3" width="74" height="74" fill="#1a0f08"/>
  <rect x="3" y="3" width="74" height="1" fill="#6B3A1F"/>
  <rect x="3" y="3" width="1" height="74" fill="#6B3A1F"/>
  <rect x="3" y="76" width="74" height="1" fill="#0d0804"/>
  <rect x="76" y="3" width="1" height="74" fill="#0d0804"/>

  <!-- Background: African riverbank, brown earth + water -->
  <rect x="4" y="4" width="72" height="72" fill="#8A5820"/>
  <!-- Water pool below (where gravel is washed) -->
  <rect x="4" y="44" width="72" height="32" fill="#3870A0"/>
  <rect x="4" y="44" width="72" height="4"  fill="#4882B0"/>
  <!-- Water ripples -->
  <rect x="10" y="50" width="20" height="2" fill="#5090C0" opacity="0.6"/>
  <rect x="42" y="52" width="16" height="2" fill="#5090C0" opacity="0.6"/>
  <rect x="20" y="58" width="30" height="2" fill="#4882B0" opacity="0.5"/>
  <rect x="56" y="60" width="14" height="2" fill="#5090C0" opacity="0.5"/>
  <!-- Gravel / earth bank top -->
  <rect x="4" y="4"  width="72" height="44" fill="#9A6428"/>
  <rect x="4" y="4"  width="72" height="6"  fill="#AA7030"/>
  <!-- Earth texture -->
  <rect x="12" y="10" width="8"  height="4" fill="#8A5818" opacity="0.7"/>
  <rect x="50" y="8"  width="12" height="4" fill="#7A5018" opacity="0.6"/>
  <rect x="26" y="18" width="10" height="3" fill="#8A5818" opacity="0.7"/>
  <rect x="58" y="20" width="8"  height="3" fill="#7A5018" opacity="0.6"/>

  <!-- === SIEVE / PENEIRA DE CLASSIFICAÇÃO === -->
  <!-- Outer rim (galvanised steel, circular → pixel rect steps) -->
  <!-- Top rim arc -->
  <rect x="14" y="14" width="52" height="6"  fill="#909080"/>
  <rect x="10" y="18" width="60" height="4"  fill="#909080"/>
  <rect x="8"  y="20" width="64" height="4"  fill="#909080"/>
  <!-- Bottom rim arc -->
  <rect x="14" y="44" width="52" height="6"  fill="#707068"/>
  <rect x="10" y="40" width="60" height="6"  fill="#808070"/>
  <rect x="8"  y="38" width="64" height="4"  fill="#888878"/>
  <!-- Left wall -->
  <rect x="8"  y="20" width="6"  height="22" fill="#888878"/>
  <rect x="8"  y="20" width="4"  height="22" fill="#909080"/>
  <!-- Right wall -->
  <rect x="66" y="20" width="6"  height="22" fill="#707068"/>
  <rect x="68" y="20" width="4"  height="22" fill="#787870"/>
  <!-- Rim highlights (galvanised shine) -->
  <rect x="14" y="14" width="52" height="2"  fill="#B0B0A0"/>
  <rect x="10" y="18" width="60" height="2"  fill="#A8A898"/>
  <rect x="8"  y="20" width="2"  height="22" fill="#A0A090"/>

  <!-- MESH / SCREEN (the sieve mesh, key feature) -->
  <!-- Mesh background (dark, fine grid) -->
  <rect x="12" y="20" width="56" height="22" fill="#484838"/>
  <!-- Horizontal mesh wires -->
  <rect x="12" y="22" width="56" height="1"  fill="#606050"/>
  <rect x="12" y="25" width="56" height="1"  fill="#606050"/>
  <rect x="12" y="28" width="56" height="1"  fill="#606050"/>
  <rect x="12" y="31" width="56" height="1"  fill="#606050"/>
  <rect x="12" y="34" width="56" height="1"  fill="#606050"/>
  <rect x="12" y="37" width="56" height="1"  fill="#606050"/>
  <rect x="12" y="40" width="56" height="1"  fill="#606050"/>
  <!-- Vertical mesh wires -->
  <rect x="14" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="18" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="22" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="26" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="30" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="34" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="38" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="42" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="46" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="50" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="54" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="58" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="62" y="20" width="1"  height="22" fill="#606050"/>
  <rect x="66" y="20" width="1"  height="22" fill="#606050"/>

  <!-- GRAVEL IN SIEVE (yellow-brown rocks being sorted) -->
  <!-- Large pebbles (too big to pass through) -->
  <rect x="16" y="24" width="6"  height="4"  fill="#B08840"/>
  <rect x="17" y="23" width="4"  height="5"  fill="#C09A50"/>
  <rect x="24" y="26" width="8"  height="4"  fill="#A07830"/>
  <rect x="25" y="25" width="6"  height="5"  fill="#B08840"/>
  <rect x="36" y="23" width="6"  height="4"  fill="#B08840"/>
  <rect x="37" y="22" width="4"  height="5"  fill="#C09A50"/>
  <rect x="46" y="25" width="8"  height="4"  fill="#A07830"/>
  <rect x="47" y="24" width="6"  height="5"  fill="#B08840"/>
  <rect x="56" y="24" width="6"  height="4"  fill="#B08840"/>
  <rect x="57" y="23" width="4"  height="5"  fill="#C09A50"/>
  <!-- Medium gravel -->
  <rect x="20" y="32" width="4"  height="4"  fill="#9A7228"/>
  <rect x="30" y="30" width="4"  height="4"  fill="#AA8030"/>
  <rect x="44" y="32" width="4"  height="4"  fill="#9A7228"/>
  <rect x="58" y="30" width="4"  height="4"  fill="#AA8030"/>
  <!-- DIAMOND brute caught in sieve (glinting!) -->
  <rect x="34" y="34" width="6"  height="4"  fill="#C0DCFF"/>
  <rect x="35" y="33" width="4"  height="5"  fill="#D0ECFF"/>
  <rect x="36" y="33" width="2"  height="2"  fill="#FFFFFF"/>
  <rect x="35" y="33" width="1"  height="1"  fill="#FFFFFF"/>
  <!-- Diamond sparkle cross -->
  <rect x="37" y="31" width="1"  height="5"  fill="#E8F4FF" opacity="0.9"/>
  <rect x="34" y="34" width="7"  height="1"  fill="#E8F4FF" opacity="0.9"/>
  <!-- Fine soil falling through mesh (dots below) -->
  <rect x="16" y="48" width="2"  height="3"  fill="#7A5820" opacity="0.7"/>
  <rect x="24" y="50" width="2"  height="3"  fill="#7A5820" opacity="0.6"/>
  <rect x="34" y="47" width="2"  height="4"  fill="#7A5820" opacity="0.7"/>
  <rect x="46" y="49" width="2"  height="3"  fill="#7A5820" opacity="0.6"/>
  <rect x="58" y="48" width="2"  height="3"  fill="#7A5820" opacity="0.7"/>

  <!-- HANDLES (two wood grips, each side) -->
  <!-- Left handle -->
  <rect x="4"  y="26" width="6"  height="10" fill="#7A5228"/>
  <rect x="5"  y="27" width="4"  height="8"  fill="#8A6030"/>
  <rect x="5"  y="28" width="2"  height="6"  fill="#9A7038"/><!-- highlight -->
  <!-- Right handle -->
  <rect x="70" y="26" width="6"  height="10" fill="#7A5228"/>
  <rect x="71" y="27" width="4"  height="8"  fill="#8A6030"/>
  <rect x="73" y="28" width="2"  height="6"  fill="#9A7038"/>

  <!-- Water drops falling from sieve bottom -->
  <rect x="20" y="52" width="2"  height="4"  fill="#4882B0" opacity="0.8"/>
  <rect x="40" y="50" width="2"  height="4"  fill="#5090C0" opacity="0.7"/>
  <rect x="60" y="52" width="2"  height="4"  fill="#4882B0" opacity="0.8"/>

  <!-- Corner bolts -->
  <rect x="4"  y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="4"  y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="5"  y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="5"  y="74" width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="74" width="1" height="1" fill="#FFD080"/>
</svg>
