<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 80 80" shape-rendering="crispEdges" width="160" height="160" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs/>
  <!-- Card frame -->
  <rect x="0" y="0" width="80" height="80" fill="#2C1810"/>
  <rect x="2" y="2" width="76" height="76" fill="#3D2214"/>
  <rect x="3" y="3" width="74" height="74" fill="#1a0f08"/>
  <rect x="3" y="3" width="74" height="1" fill="#6B3A1F"/>
  <rect x="3" y="3" width="1" height="74" fill="#6B3A1F"/>
  <rect x="3" y="76" width="74" height="1" fill="#0d0804"/>
  <rect x="76" y="3" width="1" height="74" fill="#0d0804"/>

  <!-- Background: dark jeweler's cloth (deep green felt) -->
  <rect x="4" y="4" width="72" height="72" fill="#1A2A1A"/>
  <!-- Felt texture bands -->
  <rect x="4" y="4"  width="72" height="3" fill="#1E2E1E"/>
  <rect x="4" y="14" width="72" height="2" fill="#162418"/>
  <rect x="4" y="28" width="72" height="2" fill="#1E2E1E"/>
  <rect x="4" y="44" width="72" height="2" fill="#162418"/>
  <rect x="4" y="58" width="72" height="2" fill="#1E2E1E"/>

  <!-- Diamond specimen on cloth (bottom, being examined) -->
  <!-- Raw diamond crystal (octahedral, pixel) -->
  <rect x="40" y="60" width="10" height="8"  fill="#C0D8F0"/>
  <rect x="38" y="62" width="14" height="6"  fill="#D0E8FF"/>
  <rect x="42" y="58" width="6"  height="4"  fill="#B0C8E0"/>
  <rect x="44" y="56" width="4"  height="4"  fill="#A8C0D8"/>
  <!-- Diamond facet highlights -->
  <rect x="40" y="60" width="4"  height="2"  fill="#E8F4FF"/>
  <rect x="44" y="62" width="4"  height="2"  fill="#B8D0EC"/>
  <rect x="42" y="58" width="2"  height="2"  fill="#FFFFFF"/>
  <!-- Diamond sparkle cross -->
  <rect x="43" y="55" width="2"  height="6"  fill="#E0F0FF" opacity="0.8"/>
  <rect x="40" y="58" width="8"  height="2"  fill="#E0F0FF" opacity="0.8"/>
  <rect x="44" y="54" width="1"  height="1"  fill="#FFFFFF"/>

  <!-- === LOUPE / MAGNIFYING GLASS (10x lapidary loupe) === -->
  <!-- Handle (brass, cylindrical) -->
  <rect x="54" y="46" width="6"  height="26" fill="#B8881A"/>
  <rect x="55" y="46" width="4"  height="26" fill="#D4A028"/>
  <rect x="55" y="47" width="2"  height="24" fill="#E0B040"/><!-- highlight streak -->
  <!-- Handle grip knurling (detail rings) -->
  <rect x="54" y="50" width="6"  height="2"  fill="#A07818"/>
  <rect x="54" y="56" width="6"  height="2"  fill="#A07818"/>
  <rect x="54" y="62" width="6"  height="2"  fill="#A07818"/>
  <rect x="54" y="68" width="6"  height="2"  fill="#A07818"/>
  <!-- Handle base cap -->
  <rect x="53" y="70" width="8"  height="4"  fill="#8A6010"/>
  <rect x="54" y="71" width="6"  height="2"  fill="#C09020"/>

  <!-- Lens housing (brass ring, circular rendered in pixel steps) -->
  <!-- Outer ring -->
  <rect x="18" y="10" width="36" height="36" fill="#B8881A"/>
  <rect x="16" y="14" width="40" height="28" fill="#B8881A"/>
  <rect x="14" y="18" width="44" height="20" fill="#B8881A"/>
  <rect x="20" y="8"  width="32" height="4"  fill="#B8881A"/>
  <rect x="20" y="46" width="32" height="4"  fill="#B8881A"/>
  <!-- Outer ring highlight / bevel -->
  <rect x="18" y="10" width="36" height="2"  fill="#D4A028"/>
  <rect x="16" y="14" width="2"  height="28" fill="#D4A028"/>
  <rect x="54" y="14" width="2"  height="28" fill="#9A7010"/><!-- shadow side -->
  <rect x="18" y="44" width="36" height="2"  fill="#9A7010"/>
  <!-- Inner ring (darker, holds lens) -->
  <rect x="22" y="14" width="28" height="28" fill="#7A5808"/>
  <rect x="20" y="16" width="32" height="24" fill="#7A5808"/>
  <rect x="24" y="12" width="24" height="4"  fill="#7A5808"/>
  <rect x="24" y="40" width="24" height="4"  fill="#7A5808"/>

  <!-- LENS (glass, refractive blue-clear) -->
  <rect x="24" y="16" width="24" height="24" fill="#7AAED8"/>
  <rect x="22" y="18" width="28" height="20" fill="#7AAED8"/>
  <rect x="26" y="14" width="20" height="4"  fill="#7AAED8"/>
  <rect x="26" y="38" width="20" height="4"  fill="#6898C8"/>
  <!-- Lens internal reflection / bloom -->
  <rect x="24" y="16" width="12" height="12" fill="#90C0E8"/>
  <rect x="22" y="18" width="10" height="8"  fill="#A8D0F0"/>
  <rect x="24" y="16" width="6"  height="4"  fill="#C8E8FF"/>
  <rect x="24" y="16" width="2"  height="2"  fill="#FFFFFF"/>
  <!-- Lens lower shade -->
  <rect x="36" y="30" width="12" height="8"  fill="#5888B8"/>
  <rect x="38" y="36" width="12" height="6"  fill="#4878A8"/>
  <!-- Lens rim glint -->
  <rect x="26" y="14" width="20" height="2"  fill="#D0E8FF"/>
  <rect x="22" y="18" width="2"  height="6"  fill="#C0D8F0"/>

  <!-- Magnified diamond shape visible inside lens -->
  <rect x="32" y="22" width="8"  height="8"  fill="#E0F2FF" opacity="0.6"/>
  <rect x="34" y="20" width="4"  height="2"  fill="#D0E8FF" opacity="0.7"/>
  <rect x="30" y="24" width="2"  height="4"  fill="#C8E0F8" opacity="0.6"/>
  <rect x="40" y="24" width="2"  height="4"  fill="#C8E0F8" opacity="0.5"/>
  <rect x="34" y="30" width="4"  height="2"  fill="#B8D0E8" opacity="0.6"/>
  <!-- Sparkle in lens center -->
  <rect x="35" y="25" width="2"  height="2"  fill="#FFFFFF" opacity="0.9"/>

  <!-- Hinge connecting handle to housing -->
  <rect x="52" y="26" width="4"  height="6"  fill="#C09020"/>
  <rect x="53" y="25" width="2"  height="8"  fill="#D4A830"/>

  <!-- Corner bolts -->
  <rect x="4"  y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="4"  y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="5"  y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="5"  y="74" width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="74" width="1" height="1" fill="#FFD080"/>
</svg>
