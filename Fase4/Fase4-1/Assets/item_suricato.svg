<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg viewBox="0 0 80 80" shape-rendering="crispEdges" width="160" height="160" version="1.1" xmlns="http://www.w3.org/2000/svg">
  <defs/>
  <!-- Card frame -->
  <rect x="0" y="0" width="80" height="80" fill="#2C1810"/>
  <rect x="2" y="2" width="76" height="76" fill="#3D2214"/>
  <rect x="3" y="3" width="74" height="74" fill="#1a0f08"/>
  <!-- Inner frame highlight -->
  <rect x="3" y="3" width="74" height="1" fill="#6B3A1F"/>
  <rect x="3" y="3" width="1" height="74" fill="#6B3A1F"/>
  <rect x="3" y="76" width="74" height="1" fill="#0d0804"/>
  <rect x="76" y="3" width="1" height="74" fill="#0d0804"/>

  <!-- Background: African savanna warm ground -->
  <rect x="4" y="4" width="72" height="72" fill="#C8701C"/>
  <!-- Sky band top -->
  <rect x="4" y="4" width="72" height="24" fill="#5AA0D0"/>
  <rect x="4" y="4" width="72" height="8" fill="#6AB4E4"/>
  <!-- Sun -->
  <rect x="62" y="6" width="7" height="7" fill="#FFE830"/>
  <rect x="63" y="5" width="5" height="1" fill="#FFE830"/>
  <rect x="63" y="13" width="5" height="1" fill="#FFE830"/>
  <rect x="61" y="8" width="1" height="3" fill="#FFE830"/>
  <rect x="69" y="8" width="1" height="3" fill="#FFE830"/>
  <rect x="62" y="6" width="2" height="2" fill="#FFFB90"/>
  <!-- Ground -->
  <rect x="4" y="52" width="72" height="24" fill="#B86018"/>
  <rect x="4" y="52" width="72" height="2" fill="#CC7020"/>
  <!-- Ground texture -->
  <rect x="8"  y="56" width="6" height="2" fill="#A85818"/>
  <rect x="20" y="58" width="8" height="2" fill="#A85818"/>
  <rect x="50" y="55" width="6" height="2" fill="#A85818"/>
  <rect x="64" y="57" width="8" height="2" fill="#A85818"/>
  <!-- Rock pedestal (where meerkat stands) -->
  <rect x="28" y="46" width="24" height="8" fill="#9A6830"/>
  <rect x="30" y="44" width="20" height="4" fill="#B07840"/>
  <rect x="32" y="43" width="16" height="2" fill="#C08848"/>

  <!-- === MEERKAT (Suricato) full body, sentinel pose === -->
  <!-- Tail (curved behind) -->
  <rect x="44" y="38" width="4" height="14" fill="#A87030"/>
  <rect x="48" y="34" width="3" height="6"  fill="#A87030"/>
  <rect x="50" y="31" width="3" height="4"  fill="#9A6828"/>
  <rect x="52" y="29" width="2" height="3"  fill="#9A6828"/>
  <!-- Body -->
  <rect x="32" y="32" width="16" height="18" fill="#D4985A"/>
  <rect x="33" y="33" width="14" height="16" fill="#DCA868"/>
  <!-- Belly (lighter) -->
  <rect x="35" y="36" width="10" height="12" fill="#E8C890"/>
  <rect x="36" y="37" width="8"  height="10" fill="#F0D8A8"/>
  <!-- Dark back stripe -->
  <rect x="38" y="32" width="4" height="18" fill="#B87838" opacity="0.5"/>
  <!-- Front legs -->
  <rect x="33" y="48" width="4" height="6"  fill="#C88848"/>
  <rect x="43" y="48" width="4" height="6"  fill="#C88848"/>
  <!-- Paws -->
  <rect x="32" y="53" width="5" height="2"  fill="#A87030"/>
  <rect x="43" y="53" width="5" height="2"  fill="#A87030"/>
  <!-- Arms (folded in front, sentinel) -->
  <rect x="30" y="38" width="4" height="8"  fill="#C88848"/>
  <rect x="46" y="38" width="4" height="8"  fill="#C88848"/>
  <rect x="30" y="44" width="6" height="2"  fill="#B07838"/><!-- left hand -->
  <rect x="44" y="44" width="6" height="2"  fill="#B07838"/><!-- right hand -->

  <!-- Head -->
  <rect x="33" y="20" width="14" height="14" fill="#D4985A"/>
  <rect x="34" y="21" width="12" height="12" fill="#DCA868"/>
  <!-- Face: dark mask patches around eyes -->
  <rect x="34" y="23" width="4" height="4"  fill="#5A3010"/><!-- left eye patch -->
  <rect x="42" y="23" width="4" height="4"  fill="#5A3010"/><!-- right eye patch -->
  <!-- Eyes (bright, alert) -->
  <rect x="35" y="24" width="2" height="2"  fill="#1A0A04"/>
  <rect x="43" y="24" width="2" height="2"  fill="#1A0A04"/>
  <rect x="35" y="24" width="1" height="1"  fill="#FFFFFF"/><!-- eye shine -->
  <rect x="43" y="24" width="1" height="1"  fill="#FFFFFF"/>
  <!-- Nose -->
  <rect x="38" y="28" width="4" height="2"  fill="#6A2A08"/>
  <rect x="39" y="27" width="2" height="2"  fill="#7A3A10"/>
  <!-- Mouth hint -->
  <rect x="38" y="30" width="2" height="1"  fill="#7A3A10"/>
  <rect x="40" y="30" width="2" height="1"  fill="#7A3A10"/>
  <!-- Ears -->
  <rect x="33" y="18" width="4" height="4"  fill="#C88848"/>
  <rect x="34" y="17" width="2" height="3"  fill="#D4985A"/>
  <rect x="43" y="18" width="4" height="4"  fill="#C88848"/>
  <rect x="44" y="17" width="2" height="3"  fill="#D4985A"/>
  <!-- Inner ear dark -->
  <rect x="34" y="19" width="2" height="2"  fill="#8A4820"/>
  <rect x="44" y="19" width="2" height="2"  fill="#8A4820"/>
  <!-- Forehead stripe -->
  <rect x="38" y="19" width="4" height="3"  fill="#C88040" opacity="0.6"/>

  <!-- Corner bolts -->
  <rect x="4"  y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="4"  width="3" height="3" fill="#C8A060"/>
  <rect x="4"  y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="73" y="73" width="3" height="3" fill="#C8A060"/>
  <rect x="5"  y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="5"  width="1" height="1" fill="#FFD080"/>
  <rect x="5"  y="74" width="1" height="1" fill="#FFD080"/>
  <rect x="74" y="74" width="1" height="1" fill="#FFD080"/>
</svg>
